<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leagues | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --pd-bg-dark: #0a0a0a;
        --pd-bg-page: #f5f5f5;
        --pd-surface: #ffffff;
        --pd-text-dark: #111111;
        --pd-text-muted: #767676;
        --pd-text-light: #ffffff;
        --pd-text-light-muted: #8a8a8a;
        --pd-border: #ececec;
        --pd-border-strong: #dcdcdc;
        --pd-radius-card: 14px;
        --pd-radius-btn: 9px;
        --pd-shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
      }
      body { margin: 0; font-family: Arial, sans-serif; background-color: var(--pd-bg-dark); color: var(--pd-text-light); }
      header { background-color: var(--pd-bg-dark); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 500; }
      header .brand { display: flex; align-items: center; gap: 10px; }
      header img { height: 34px; width: 34px; border-radius: 9px; background: #ffffff; padding: 2px; }
      header .brand-name { color: var(--pd-text-light); font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
      .hamburger { display: block; background: none; border: none; color: var(--pd-text-light); font-size: 1.6em; cursor: pointer; padding: 0; line-height: 1; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: var(--pd-bg-dark); z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      nav.open { display: flex; }
      nav a { color: var(--pd-text-light); text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #222222; }
      nav a:hover { background-color: #1a1a1a; }
      nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #222222; border-radius: 0; padding: 14px 24px; font-size: 1em; margin: 0; color: var(--pd-text-light); background: none; cursor: pointer; font-family: Arial, sans-serif; }
      nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #1a1a1a; }
      nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #222222; color: var(--pd-text-light); font-size: 0.9em; }
      .hero { position: relative; padding: 8px 28px 44px; overflow: hidden; }
      .hero-watermark { position: fixed; bottom: -120px; right: -80px; height: 520px; width: 520px; object-fit: contain; opacity: 0.15; pointer-events: none; z-index: 0; }
      .hero-kicker { position: relative; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; color: var(--pd-text-light-muted); margin-bottom: 10px; text-transform: uppercase; }
      .hero-title { position: relative; font-size: 26px; font-weight: bold; color: var(--pd-text-light); line-height: 1.25; margin: 0 0 20px; max-width: 460px; }
      .hero-stats { position: relative; display: flex; gap: 28px; flex-wrap: wrap; }
      .hero-stat-value { font-size: 22px; font-weight: bold; color: var(--pd-text-light); }
      .hero-stat-label { font-size: 12px; color: var(--pd-text-light-muted); margin-top: 2px; }
      main { padding: 8px 28px 40px; max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
      h2 { font-size: 16px; font-weight: bold; margin: 0 0 14px; color: var(--pd-text-light); }
      .league-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 28px; }
      .league-card { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); padding: 18px 20px; box-shadow: var(--pd-shadow-card); }
      .league-card .badges-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .league-card h3 { margin: 0 0 6px; font-size: 16px; font-weight: bold; color: var(--pd-text-dark); }
      .league-card .meta-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--pd-text-muted); margin-bottom: 3px; }
      .league-card .meta-row i { font-size: 14px; }
      .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
      .badge-live { background-color: var(--pd-text-dark); color: var(--pd-text-light); }
      .badge-upcoming { background-color: #eeeeee; color: #555555; }
      .badge-completed { background-color: #f3f3f3; color: #888888; }
      .badge-paid { background-color: #444444; color: #ffffff; }
      .card-actions { display: flex; gap: 8px; margin-top: 16px; }
      .btn-view, .btn-join { flex: 1; text-align: center; padding: 10px 0; border-radius: var(--pd-radius-btn); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; font-family: Arial, sans-serif; }
      .btn-view { background-color: var(--pd-text-dark); color: var(--pd-text-light); border: none; }
      .btn-view:hover { background-color: #333333; }
      .btn-join { background-color: var(--pd-surface); color: var(--pd-text-dark); border: 1px solid var(--pd-border-strong); }
      .btn-join:hover { background-color: #f5f5f5; }
      .btn-join.joined { background-color: #f5f5f5; color: var(--pd-text-muted); cursor: default; }
      .coming-soon { text-align: center; padding: 50px 20px; color: var(--pd-text-light-muted); font-size: 1em; }
      .loading { text-align: center; padding: 40px; color: var(--pd-text-light-muted); }
      .archive-link { text-align: center; margin-top: 8px; }
      .archive-link a { color: var(--pd-text-light-muted); font-size: 0.9em; text-decoration: none; }
      @media (max-width: 700px) {
        header { padding: 14px 20px; }
        .hero { padding: 8px 20px 36px; }
        .hero-title { font-size: 22px; }
        .hero-watermark { height: 420px; width: 420px; bottom: -90px; right: -70px; }
        main { padding: 8px 20px 32px; }
        .league-grid { grid-template-columns: 1fr; }
        .league-card { text-align: center; }
        .league-card .badges-row { justify-content: center; }
        .league-card .meta-row { justify-content: center; }
      }
    </style>
  </head>
  <body>
   <header>
    <div class="brand">
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div class="brand-name">Pinnacle Darts League</div>
    </div>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a href="leagues.html">Leagues</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="players.html">Players</a>
      <a href="academy.html" class="btn-switch" style="border:none;text-align:left;">Switch to Academy</a>
      <div id="authButtons" style="padding:14px 24px;"></div>
    </nav>
  </header>
  <div class="hero">
    <img src="logo-watermark.png" alt="" class="hero-watermark">
    <div class="hero-kicker">Leagues</div>
    <div class="hero-title">Find your division.</div>
    <div class="hero-stats">
      <div><div class="hero-stat-value" id="statLive">-</div><div class="hero-stat-label">Live now</div></div>
      <div><div class="hero-stat-value" id="statUpcoming">-</div><div class="hero-stat-label">Upcoming</div></div>
      <div><div class="hero-stat-value" id="statPlayers">-</div><div class="hero-stat-label">Players entered</div></div>
    </div>
  </div>
  <main>
    <div id="myLeaguesSection" style="display:none;">
      <h2>My leagues</h2>
      <div id="myLeaguesList" class="league-grid"></div>
    </div>
    <h2>All leagues</h2>
    <div id="leaguesList" class="league-grid"><p class="loading">Loading leagues...</p></div>
    <p class="archive-link"><a href="leagues-archive.html">View League Archive →</a></p>
  </main>
    <script>
      var currentUserId = null;
      var joinedLeagues = [];
async function loadLeagues() {
  var session = await sbClient.auth.getSession();
  var playerPlatform = null;
  var playerHasAverage = false;
  if (session.data.session) {
    currentUserId = session.data.session.user.id;
    var joined = await sbClient.from('league_players').select('league_id').eq('player_id', currentUserId);
    joinedLeagues = joined.data ? joined.data.map(function(j) { return j.league_id; }) : [];
    var profileResult = await sbClient.from('profiles').select('platform, average, starter_average').eq('id', currentUserId).single();
    playerPlatform = profileResult.data ? profileResult.data.platform : null;
    playerHasAverage = profileResult.data ? !!(profileResult.data.average || profileResult.data.starter_average) : false;
  }
        var result = await sbClient.from('leagues').select('*').or('section.eq.online,section.eq.both').order('start_date', { ascending: true });
        var container = document.getElementById('leaguesList');
        if (!result.data || !result.data.length) {
          container.innerHTML = '<p class="coming-soon">No leagues yet — check back soon!</p>';
          document.getElementById('statLive').textContent = '0';
          document.getElementById('statUpcoming').textContent = '0';
          document.getElementById('statPlayers').textContent = '0';
          return;
        }
var countResult = await sbClient.from('league_players').select('league_id');
        var playerCounts = {};
        if (countResult.data) {
          countResult.data.forEach(function(row) {
            playerCounts[parseInt(row.league_id)] = (playerCounts[parseInt(row.league_id)] || 0) + 1;
          });
        }
        var matchCountResult = await sbClient.from('league_matches').select('league_id, status').eq('stage', 'regular');
        var gamesPlayedCounts = {};
        var gamesTotalCounts = {};
        if (matchCountResult.data) {
          matchCountResult.data.forEach(function(row) {
            var lid = parseInt(row.league_id);
            gamesTotalCounts[lid] = (gamesTotalCounts[lid] || 0) + 1;
            if (row.status === 'completed') { gamesPlayedCounts[lid] = (gamesPlayedCounts[lid] || 0) + 1; }
          });
        }
        var formatLabels = { round_robin: 'Round Robin', home_away: 'Home & Away', swiss: 'Swiss System' };
        var platformLabels = { dartcounter: 'Dartcounter', scolia: 'Scolia', in_person: 'In Person', both: 'Both' };
var cardsHtml = [];
var myCardsHtml = [];
var liveCount = 0;
var upcomingCount = 0;
var totalPlayersEntered = 0;
for (var i = 0; i < result.data.length; i++) {
  var l = result.data[i];
  var status = await computeLeagueStatus(l);
  if (status === 'completed') { continue; }
  if (playerPlatform && playerPlatform !== 'both' && l.platform !== 'in_person' && l.platform !== 'both' && l.platform !== playerPlatform) {
    continue;
  }
  if (status === 'live') { liveCount++; } else { upcomingCount++; }
var startStr = l.start_date ? new Date(l.start_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
  var endStr = 'TBC';
  if (l.start_date && l.players_per_division) {
    var divSize = parseInt(l.players_per_division);
    var matchesPerWeek = parseInt(l.matches_per_week) || 1;
    var rounds = l.format === 'home_away' ? 2 * (divSize - 1) : (divSize - 1);
    if (l.format === 'swiss' && l.swiss_games) { rounds = parseInt(l.swiss_games); }
    var weeks = Math.ceil(rounds / matchesPerWeek);
    var estEnd = new Date(l.start_date);
    estEnd.setDate(estEnd.getDate() + (weeks - 1) * 7);
    endStr = estEnd.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ' (est.)';
  }
var playerCount = playerCounts[parseInt(l.id)] || 0;
  totalPlayersEntered += playerCount;
  var maxStr = l.players_per_division ? playerCount + ' / ' + l.players_per_division + ' (division size)' : playerCount + ' players';
  var isFull = l.max_players && playerCount >= l.max_players;
  var totalGames = gamesTotalCounts[parseInt(l.id)] || 0;
  var playedGames = gamesPlayedCounts[parseInt(l.id)] || 0;
  var gamesProgressRow = totalGames > 0 ? '<div class="meta-row"><i class="ti ti-chart-bar"></i><strong>Games:</strong> ' + playedGames + ' / ' + totalGames + '</div>' : '';
  var hasJoined = joinedLeagues.indexOf(l.id) > -1;
var joinBtn = '';
if (currentUserId) {
  if (hasJoined) {
    joinBtn = '<button class="btn-join" onclick="leaveLeague(' + l.id + ', this)">Leave</button>';
  } else if (isFull) {
    joinBtn = '<button class="btn-join" disabled style="opacity:0.5;cursor:default;">Full</button>';
  } else if (l.average_split && !playerHasAverage) {
    joinBtn = '<button class="btn-join" disabled style="opacity:0.5;cursor:default;" title="You need an average set before joining this league">Average required</button>';
  } else {
    joinBtn = '<button class="btn-join" onclick="joinLeague(' + l.id + ', this)">Join</button>';
  }
} else {
  joinBtn = '<a href="login.html" class="btn-join">Login to join</a>';
}
var statusBadge = status === 'live'
  ? '<span class="badge badge-live"><i class="ti ti-bolt"></i>Live</span>'
  : '<span class="badge badge-upcoming"><i class="ti ti-clock"></i>Upcoming</span>';
var paidBadge = l.is_paid ? '<span class="badge badge-paid"><i class="ti ti-currency-pound"></i>£' + l.entry_fee + ' entry</span>' : '';
  var matchesPerWeekLabel = l.matches_per_week === 0 ? 'Unlimited' : (l.matches_per_week || 1) + ' per week';
  var cardHtml = '<div class="league-card">' +
    '<div class="badges-row">' + statusBadge + paidBadge + '</div>' +
    '<h3>' + l.name + '</h3>' +
    (l.season ? '<div class="meta-row"><i class="ti ti-calendar-event"></i><strong>Season:</strong> ' + l.season + '</div>' : '') +
    '<div class="meta-row"><i class="ti ti-trophy"></i><strong>Format:</strong> ' + (formatLabels[l.format] || l.format || 'TBC') + (l.playoffs ? ' + Playoffs' : '') + '</div>' +
    '<div class="meta-row"><i class="ti ti-device-gamepad-2"></i><strong>Platform:</strong> ' + (platformLabels[l.platform] || l.platform || 'TBC') + '</div>' +
    '<div class="meta-row"><i class="ti ti-target-arrow"></i><strong>Legs:</strong> First to ' + (l.bye_scoreline || 3) + ' — <strong>Matches:</strong> ' + matchesPerWeekLabel + '</div>' +
    '<div class="meta-row"><i class="ti ti-calendar"></i><strong>Dates:</strong> ' + startStr + ' — ' + endStr + '</div>' +
    '<div class="meta-row"><i class="ti ti-users"></i><strong>Players:</strong> ' + maxStr + (isFull ? ' — Full' : '') + '</div>' +
    gamesProgressRow +
    '<div class="card-actions">' +
    '<a href="league.html?id=' + l.id + '" class="btn-view">View</a>' +
    joinBtn +
    '</div>' +
    '</div>';
if (hasJoined) {
    myCardsHtml.push(cardHtml);
  } else {
    cardsHtml.push(cardHtml);
  }
}
document.getElementById('statLive').textContent = liveCount;
document.getElementById('statUpcoming').textContent = upcomingCount;
document.getElementById('statPlayers').textContent = totalPlayersEntered;
container.innerHTML = cardsHtml.length ? cardsHtml.join('') : '<p class="coming-soon">No upcoming or live leagues — check the archive for past results!</p>';
var myLeaguesSection = document.getElementById('myLeaguesSection');
if (myCardsHtml.length) {
  myLeaguesSection.style.display = 'block';
  document.getElementById('myLeaguesList').innerHTML = myCardsHtml.join('');
} else {
  myLeaguesSection.style.display = 'none';
}
      }
async function joinLeague(leagueId, btn) {
        if (!currentUserId) { window.location.href = 'login.html'; return; }
        btn.disabled = true;
        btn.textContent = 'Joining...';
        var leagueResult = await sbClient.from('leagues').select('is_paid, entry_fee').eq('id', leagueId).single();
        var league = leagueResult.data || {};
        var isPaid = league.is_paid;
        var entryFee = parseFloat(league.entry_fee) || 0;
        var paidStatus = true;
        var amountOwed = 0;
        if (isPaid && entryFee > 0) {
          var profileResult = await sbClient.from('profiles').select('credit_balance').eq('id', currentUserId).single();
          var currentBalance = profileResult.data ? parseFloat(profileResult.data.credit_balance || 0) : 0;
          amountOwed = entryFee;
          if (currentBalance >= entryFee) {
            var newBalance = currentBalance - entryFee;
            await sbClient.from('profiles').update({ credit_balance: newBalance }).eq('id', currentUserId);
            paidStatus = true;
          } else {
            paidStatus = false;
          }
        }
        var result = await sbClient.from('league_players').insert([{
          league_id: leagueId,
          player_id: currentUserId,
          paid: paidStatus,
          amount_owed: amountOwed
        }]);
        if (result.error) {
          btn.disabled = false;
          btn.textContent = 'Join';
          alert('Error joining league. Please try again.');
          return;
        }
        btn.className = 'btn-join joined';
        if (isPaid && entryFee > 0) {
          btn.textContent = paidStatus ? 'Joined (paid)' : 'Joined (payment pending)';
        } else {
          btn.textContent = 'Joined';
        }
        joinedLeagues.push(leagueId);
      }
      async function leaveLeague(leagueId, btn) {
        if (!confirm('Are you sure you want to leave this league?')) { return; }
        btn.disabled = true;
        btn.textContent = 'Leaving...';
        var entryResult = await sbClient.from('league_players').select('id, paid, amount_owed').eq('league_id', leagueId).eq('player_id', currentUserId).single();
        var entry = entryResult.data;
        var result = await sbClient.from('league_players').delete().eq('league_id', leagueId).eq('player_id', currentUserId);
        if (result.error) {
          btn.disabled = false;
          btn.textContent = 'Leave';
          alert('Error leaving league. Please try again.');
          return;
        }
        if (entry && entry.paid && entry.amount_owed > 0) {
          var profileResult = await sbClient.from('profiles').select('credit_balance').eq('id', currentUserId).single();
          var currentBalance = profileResult.data ? parseFloat(profileResult.data.credit_balance || 0) : 0;
          var refundedBalance = currentBalance + parseFloat(entry.amount_owed);
          await sbClient.from('profiles').update({ credit_balance: refundedBalance }).eq('id', currentUserId);
        }
        loadLeagues();
      }
      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }
      window.addEventListener('load', function() {
        checkAuth();
        loadLeagues();
      });
    </script>
  </body>
</html>
