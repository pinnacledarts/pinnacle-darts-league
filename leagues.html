<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leagues | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
      .hamburger { display: none; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; }
      nav { background-color: #222222; display: flex; justify-content: center; gap: 40px; padding: 15px; }
      nav a { color: #ffffff; text-decoration: none; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; }
      nav a:hover { color: #aaaaaa; }
      main { padding: 40px; max-width: 900px; margin: 0 auto; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; }
      .league-card { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; padding: 20px; margin-bottom: 16px; }
      .league-card h3 { margin: 0 0 8px; font-size: 1.2em; }
      .league-card p { margin: 4px 0; color: #555555; font-size: 0.95em; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
      .badge-status-upcoming { background-color: #eeeeee; color: #666666; }
      .badge-status-live { background-color: #f0fff0; color: #006600; border: 1px solid #cceecc; }
      .badge-status-completed { background-color: #fff0f0; color: #cc0000; border: 1px solid #ffcccc; }
      .card-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
      .btn-view { background-color: #111111; color: #ffffff; border: none; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; cursor: pointer; text-decoration: none; font-family: Arial, sans-serif; }
      .btn-view:hover { background-color: #333333; }
      .btn-join { background-color: #ffffff; color: #111111; border: 1px solid #111111; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-join:hover { background-color: #f5f5f5; }
      .btn-join.joined { background-color: #f0fff0; color: #006600; border-color: #cceecc; cursor: default; }
      .player-count { font-size: 0.85em; color: #888888; margin-top: 8px; }
      .coming-soon { text-align: center; padding: 60px 20px; color: #aaaaaa; font-size: 1.1em; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        .header-buttons { margin-left: 0; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
        .btn-switch, .btn-login, .btn-logout { font-size: 0.8em; padding: 6px 12px; min-width: 140px; }
        .hamburger { display: block; }
        nav { display: none; flex-direction: column; gap: 0; padding: 0; }
        nav.open { display: flex; }
        nav a { padding: 14px 20px; border-bottom: 1px solid #333333; font-size: 1em; }
        main { padding: 24px 20px; }
        h2 { font-size: 1.3em; }
      }
    </style>
  </head>
  <body>

    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
      <a href="academy.html" class="btn-switch">Switch to Academy</a>
      <div class="header-buttons" style="margin-left: auto;">
        <div id="authButtons"></div>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
      </div>
    </header>

    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a href="leagues.html">Leagues</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="players.html">Players</a>
    </nav>

    <main>
      <h2>Leagues</h2>
      <div id="leaguesList"><p class="loading">Loading leagues...</p></div>
      <p style="text-align:center;margin-top:20px;"><a href="leagues-archive.html" style="color:#555;font-size:0.9em;">View League Archive →</a></p>
    </main>

    <script>
      var currentUserId = null;
      var joinedLeagues = [];

      async function loadLeagues() {
        var session = await sbClient.auth.getSession();
        var playerPlatform = null;
        if (session.data.session) {
          currentUserId = session.data.session.user.id;
          var joined = await sbClient.from('league_players').select('league_id').eq('player_id', currentUserId);
          joinedLeagues = joined.data ? joined.data.map(function(j) { return j.league_id; }) : [];
          var profileResult = await sbClient.from('profiles').select('platform').eq('id', currentUserId).single();
          playerPlatform = profileResult.data ? profileResult.data.platform : null;
        }

        var result = await sbClient.from('leagues').select('*').order('start_date', { ascending: true });
        var container = document.getElementById('leaguesList');

        if (!result.data || !result.data.length) {
          container.innerHTML = '<p class="coming-soon">🎯 No leagues yet — check back soon!</p>';
          return;
        }

        var countResult = await sbClient.from('league_players').select('league_id');
        var playerCounts = {};
        if (countResult.data) {
          countResult.data.forEach(function(row) {
            playerCounts[parseInt(row.league_id)] = (playerCounts[parseInt(row.league_id)] || 0) + 1;
          });
        }

        var formatLabels = { round_robin: 'Round Robin', home_away: 'Home & Away', swiss: 'Swiss System' };
        var platformLabels = { dartcounter: 'Dartcounter', scolia: 'Scolia', in_person: 'In Person', both: 'Both' };

        var cardsHtml = [];
        for (var i = 0; i < result.data.length; i++) {
          var l = result.data[i];
          var status = await computeLeagueStatus(l);
          if (status === 'completed') { continue; }

          if (playerPlatform && playerPlatform !== 'both' && l.platform !== 'in_person' && l.platform !== 'both' && l.platform !== playerPlatform) {
            continue;
          }

          var startStr = l.start_date ? new Date(l.start_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
          var endStr = l.end_date ? new Date(l.end_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
          var playerCount = playerCounts[parseInt(l.id)] || 0;
          var maxStr = l.max_players ? playerCount + ' / ' + l.max_players + ' players' : playerCount + ' players';
          var isFull = l.max_players && playerCount >= l.max_players;
          var hasJoined = joinedLeagues.indexOf(l.id) > -1;

          var joinBtn = '';
          if (currentUserId) {
            if (hasJoined) {
              joinBtn = '<button class="btn-join joined" disabled>✓ Joined</button>';
            } else if (isFull) {
              joinBtn = '<button class="btn-join" disabled style="opacity:0.5;cursor:default;">League Full</button>';
            } else {
              joinBtn = '<button class="btn-join" onclick="joinLeague(' + l.id + ', this)">Join League</button>';
            }
          }

          cardsHtml.push('<div class="league-card">' +
            getStatusBadgeHtml(status) +
            '<h3>' + l.name + '</h3>' +
            (l.season ? '<p><strong>Season:</strong> ' + l.season + '</p>' : '') +
            '<p><strong>Format:</strong> ' + (formatLabels[l.format] || l.format || 'TBC') + (l.playoffs ? ' + Playoffs' : '') + '</p>' +
            '<p><strong>Platform:</strong> ' + (platformLabels[l.platform] || l.platform || 'TBC') + '</p>' +
            '<p><strong>Dates:</strong> ' + startStr + ' — ' + endStr + '</p>' +
            '<p class="player-count">👥 ' + maxStr + (isFull ? ' — <strong>Full</strong>' : '') + '</p>' +
            '<div class="card-actions">' +
            '<a href="league.html?id=' + l.id + '" class="btn-view">View League</a>' +
            joinBtn +
            '</div>' +
            '</div>');
        }

        container.innerHTML = cardsHtml.length ? cardsHtml.join('') : '<p class="coming-soon">🎯 No upcoming or live leagues — check the archive for past results!</p>';
      }

      async function joinLeague(leagueId, btn) {
        if (!currentUserId) { window.location.href = 'login.html'; return; }
        btn.disabled = true;
        btn.textContent = 'Joining...';
        var result = await sbClient.from('league_players').insert([{
          league_id: leagueId,
          player_id: currentUserId
        }]);
        if (result.error) {
          btn.disabled = false;
          btn.textContent = 'Join League';
          alert('Error joining league. Please try again.');
          return;
        }
        btn.className = 'btn-join joined';
        btn.textContent = '✓ Joined';
        joinedLeagues.push(leagueId);
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', function() {
        checkAuth();
        loadLeagues();
      });
    </script>

  </body>
</html>
