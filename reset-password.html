<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --pd-bg-dark: #0a0a0a;
        --pd-surface: #ffffff;
        --pd-text-dark: #111111;
        --pd-text-muted: #767676;
        --pd-text-light: #ffffff;
        --pd-text-light-muted: #8a8a8a;
        --pd-border: #ececec;
        --pd-border-strong: #dcdcdc;
        --pd-radius-card: 14px;
        --pd-radius-btn: 9px;
        --pd-shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
      }
      body { margin: 0; font-family: Arial, sans-serif; background-color: var(--pd-bg-dark); color: var(--pd-text-light); }
      header { background-color: var(--pd-bg-dark); padding: 18px 28px; display: flex; align-items: center; gap: 10px; }
      header img { height: 34px; width: 34px; border-radius: 9px; background: #ffffff; padding: 2px; }
      header .brand-name { color: var(--pd-text-light); font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
      .hero { position: relative; padding: 8px 28px 30px; overflow: hidden; }
      .hero-watermark { position: fixed; bottom: -120px; right: -80px; height: 520px; width: 520px; object-fit: contain; opacity: 0.15; pointer-events: none; z-index: 0; }
      .hero-kicker { position: relative; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; color: var(--pd-text-light-muted); margin-bottom: 10px; text-transform: uppercase; }
      .hero-title { position: relative; font-size: 26px; font-weight: bold; color: var(--pd-text-light); line-height: 1.25; margin: 0; max-width: 460px; }
      main { padding: 8px 28px 60px; max-width: 400px; margin: 0 auto; position: relative; z-index: 1; }
      .form-box { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 28px; color: var(--pd-text-dark); }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 6px; color: #333333; }
      .form-group input { width: 100%; padding: 10px; border: 1px solid var(--pd-border-strong); border-radius: var(--pd-radius-btn); font-size: 1em; background-color: #f9f9f9; color: var(--pd-text-dark); }
      .form-group input:focus { outline: none; border-color: var(--pd-text-dark); background-color: #ffffff; }
      .btn-submit { width: 100%; padding: 12px; background-color: var(--pd-text-dark); color: #ffffff; border: none; border-radius: var(--pd-radius-btn); font-size: 1em; cursor: pointer; margin-top: 8px; }
      .btn-submit:hover { background-color: #333333; }
      .error-msg { display: none; background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; padding: 10px; border-radius: var(--pd-radius-btn); margin-bottom: 16px; font-size: 0.9em; }
      .success-msg { display: none; background: #f0fff0; border: 1px solid #cceecc; color: #006600; padding: 10px; border-radius: var(--pd-radius-btn); margin-bottom: 16px; font-size: 0.9em; }
      @media (max-width: 700px) {
        header { padding: 14px 20px; }
        .hero { padding: 8px 20px 24px; }
        .hero-title { font-size: 22px; }
        .hero-watermark { height: 420px; width: 420px; bottom: -90px; right: -70px; }
        main { padding: 8px 20px 40px; }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div class="brand-name">Pinnacle Darts League</div>
    </header>
    <div class="hero">
      <img src="logo-watermark.png" alt="" class="hero-watermark">
      <div class="hero-kicker">Account</div>
      <div class="hero-title">Set New Password</div>
    </div>
    <main>
      <div class="form-box">
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg">Password updated successfully! Redirecting to login...</div>
       <div class="form-group">
  <label>New Password</label>
  <div style="position:relative;">
    <input type="password" id="newPassword" placeholder="Enter your new password" style="padding-right:60px;" />
    <button type="button" onclick="togglePasswordField('newPassword', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#555;font-size:0.85em;cursor:pointer;">Show</button>
  </div>
</div>
<div class="form-group">
  <label>Confirm New Password</label>
  <div style="position:relative;">
    <input type="password" id="confirmPassword" placeholder="Confirm your new password" style="padding-right:60px;" />
    <button type="button" onclick="togglePasswordField('confirmPassword', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#555;font-size:0.85em;cursor:pointer;">Show</button>
  </div>
</div>
        <button class="btn-submit" onclick="handleSetNewPassword()">Update Password</button>
      </div>
    </main>
    <script>
      function togglePasswordField(id, btn) {
  var input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}
      async function handleSetNewPassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        if (!newPassword || !confirmPassword) {
          errorMsg.textContent = 'Please fill in both fields.';
          errorMsg.style.display = 'block';
          return;
        }
        if (newPassword !== confirmPassword) {
          errorMsg.textContent = 'Passwords do not match.';
          errorMsg.style.display = 'block';
          return;
        }
        if (newPassword.length < 6) {
          errorMsg.textContent = 'Password must be at least 6 characters.';
          errorMsg.style.display = 'block';
          return;
        }
        const { error } = await sbClient.auth.updateUser({ password: newPassword });
        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          return;
        }
        successMsg.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    </script>
  </body>
</html>
