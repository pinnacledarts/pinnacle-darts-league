<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }

      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }

      main { padding: 40px; max-width: 400px; margin: 0 auto; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; }

      .form-box { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; padding: 30px; margin-top: 30px; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-size: 0.9em; font-weight: bold; margin-bottom: 6px; color: #333333; }
      .form-group input { width: 100%; padding: 10px; border: 1px solid #dddddd; border-radius: 4px; font-size: 1em; background-color: #f9f9f9; }
      .form-group input:focus { outline: none; border-color: #111111; background-color: #ffffff; }
      .btn-submit { width: 100%; padding: 12px; background-color: #111111; color: #ffffff; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; margin-top: 8px; }
      .btn-submit:hover { background-color: #333333; }
      .error-msg { display: none; background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9em; }
      .success-msg { display: none; background: #f0fff0; border: 1px solid #cceecc; color: #006600; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9em; }

      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        main { padding: 24px 20px; }
        h2 { font-size: 1.3em; }
      }
    </style>
  </head>
  <body>

    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
    </header>

    <main>
      <h2>Set New Password</h2>
      <div class="form-box">
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg">Password updated successfully! Redirecting to login...</div>

       <div class="form-group">
  <label>New Password</label>
  <div style="position:relative;">
    <input type="password" id="newPassword" placeholder="Enter your new password" style="padding-right:60px;" />
    <button type="button" onclick="togglePasswordField('newPassword', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#555;font-size:0.85em;cursor:pointer;">Show</button>
  </div>
</div>
<div class="form-group">
  <label>Confirm New Password</label>
  <div style="position:relative;">
    <input type="password" id="confirmPassword" placeholder="Confirm your new password" style="padding-right:60px;" />
    <button type="button" onclick="togglePasswordField('confirmPassword', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#555;font-size:0.85em;cursor:pointer;">Show</button>
  </div>
</div>
        <button class="btn-submit" onclick="handleSetNewPassword()">Update Password</button>
      </div>
    </main>

    <script>
      function togglePasswordField(id, btn) {
  var input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}

async function handleSetNewPassword() {
      async function handleSetNewPassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (!newPassword || !confirmPassword) {
          errorMsg.textContent = 'Please fill in both fields.';
          errorMsg.style.display = 'block';
          return;
        }

        if (newPassword !== confirmPassword) {
          errorMsg.textContent = 'Passwords do not match.';
          errorMsg.style.display = 'block';
          return;
        }

        if (newPassword.length < 6) {
          errorMsg.textContent = 'Password must be at least 6 characters.';
          errorMsg.style.display = 'block';
          return;
        }

        const { error } = await sbClient.auth.updateUser({ password: newPassword });

        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          return;
        }

        successMsg.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    </script>

  </body>
</html>
