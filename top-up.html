<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Credit | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --pd-bg-dark: #0a0a0a;
        --pd-surface: #ffffff;
        --pd-text-dark: #111111;
        --pd-text-muted: #767676;
        --pd-text-light: #ffffff;
        --pd-text-light-muted: #8a8a8a;
        --pd-border: #ececec;
        --pd-border-strong: #dcdcdc;
        --pd-radius-card: 14px;
        --pd-radius-btn: 9px;
        --pd-shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
      }
      body { margin: 0; font-family: Arial, sans-serif; background-color: var(--pd-bg-dark); color: var(--pd-text-light); }
      header { background-color: var(--pd-bg-dark); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 500; }
      header .brand { display: flex; align-items: center; gap: 10px; }
      header img { height: 34px; width: 34px; border-radius: 9px; background: #ffffff; padding: 2px; }
      header .brand-name { color: var(--pd-text-light); font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
      .hamburger { display: block; background: none; border: none; color: var(--pd-text-light); font-size: 1.6em; cursor: pointer; padding: 0; line-height: 1; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: var(--pd-bg-dark); z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      nav.open { display: flex; }
      nav a { color: var(--pd-text-light); text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #222222; }
      nav a:hover { background-color: #1a1a1a; }
      nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #222222; border-radius: 0; padding: 14px 24px; font-size: 1em; margin: 0; color: var(--pd-text-light); background: none; cursor: pointer; font-family: Arial, sans-serif; }
      nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #1a1a1a; }
      nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #222222; color: var(--pd-text-light); font-size: 0.9em; }
      .hero { position: relative; padding: 8px 28px 30px; overflow: hidden; }
      .hero-watermark { position: fixed; bottom: -120px; right: -80px; height: 520px; width: 520px; object-fit: contain; opacity: 0.15; pointer-events: none; z-index: 0; }
      .hero-kicker { position: relative; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; color: var(--pd-text-light-muted); margin-bottom: 10px; text-transform: uppercase; }
      .hero-title { position: relative; font-size: 26px; font-weight: bold; color: var(--pd-text-light); line-height: 1.25; margin: 0; max-width: 460px; }
      main { padding: 8px 28px 40px; max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }
      h3 { font-size: 16px; font-weight: bold; margin: 32px 0 14px; color: var(--pd-text-light); }
      h3:first-of-type { margin-top: 0; }
      .balance-box { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 30px; text-align: center; margin-bottom: 8px; color: var(--pd-text-dark); }
      .balance-box .label { font-size: 0.85em; color: var(--pd-text-muted); text-transform: uppercase; letter-spacing: 1px; }
      .balance-box .amount { font-size: 3em; font-weight: bold; margin-top: 8px; }
      .package-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
      .package-card { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 20px; text-align: center; color: var(--pd-text-dark); }
      .package-card .amount { font-size: 1.6em; font-weight: bold; margin-bottom: 12px; }
      .btn-topup { display: inline-block; background-color: var(--pd-text-dark); color: #ffffff; border: none; padding: 10px 20px; border-radius: var(--pd-radius-btn); font-size: 0.9em; cursor: pointer; font-family: Arial, sans-serif; text-decoration: none; }
      .btn-topup:hover { background-color: #333333; }
      .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background-color: var(--pd-surface); border-radius: var(--pd-radius-btn); box-shadow: var(--pd-shadow-card); margin-bottom: 8px; font-size: 0.9em; color: var(--pd-text-dark); }
      .status-paid { color: #006600; font-weight: bold; }
      .status-pending { color: #cc0000; font-weight: bold; }
      .coming-soon { text-align: center; padding: 40px 20px; color: var(--pd-text-light-muted); font-size: 1em; }
      .loading { text-align: center; padding: 40px; color: var(--pd-text-light-muted); }
      @media (max-width: 700px) {
        header { padding: 14px 20px; }
        .hero { padding: 8px 20px 24px; }
        .hero-title { font-size: 22px; }
        .hero-watermark { height: 420px; width: 420px; bottom: -90px; right: -70px; }
        main { padding: 8px 20px 32px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="logo.png" alt="Pinnacle Darts Logo">
        <div class="brand-name">Pinnacle Darts League</div>
      </div>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <nav id="mainNav">
        <a href="index.html">Home</a>
        <a href="leagues.html">Leagues</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="players.html">Players</a>
        <a href="shirt-builder.html">Shirt Builder</a>
        <a href="merch.html">Merch</a>
        <a href="top-up.html">Site Credit</a>
        <a href="academy.html" class="btn-switch" style="border:none;text-align:left;">Switch to Academy</a>
        <div id="authButtons" style="padding:14px 24px;"></div>
      </nav>
    </header>
    <div class="hero">
      <img src="logo-watermark.png" alt="" class="hero-watermark">
      <div class="hero-kicker">Wallet</div>
      <div class="hero-title">Site Credit</div>
    </div>
    <main>
      <div id="loggedOutMsg" class="coming-soon" style="display:none;">
        <p>Please <a href="login.html" style="color:var(--pd-text-light);">log in</a> to view and top up your site credit.</p>
      </div>
      <div id="creditContent" style="display:none;">
        <div class="balance-box">
          <div class="label">Your Balance</div>
          <div class="amount" id="balanceAmount">£0.00</div>
        </div>
        <h3>Top Up</h3>
        <div id="packagesGrid" class="package-grid"><p class="loading">Loading packages...</p></div>
        <h3>Top-Up History</h3>
        <div id="historyList"><p class="loading">Loading history...</p></div>
      </div>
    </main>
    <script>
      var currentUserId = null;
      async function init() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (!session) {
          document.getElementById('loggedOutMsg').style.display = 'block';
          return;
        }
        currentUserId = session.user.id;
        document.getElementById('creditContent').style.display = 'block';
        loadBalance();
        loadPackages();
        loadHistory();
      }
      async function loadBalance() {
        var result = await sbClient.from('profiles').select('credit_balance').eq('id', currentUserId).single();
        var balance = result.data ? parseFloat(result.data.credit_balance || 0) : 0;
        document.getElementById('balanceAmount').textContent = '£' + balance.toFixed(2);
      }
      async function loadPackages() {
        var result = await sbClient.from('credit_topup_packages').select('*').eq('active', true).order('amount');
        var container = document.getElementById('packagesGrid');
        if (!result.data || !result.data.length) { container.innerHTML = '<p class="coming-soon">No top-up options available right now.</p>'; return; }
        container.innerHTML = result.data.map(function(p) {
          return '<div class="package-card">' +
            '<div class="amount">£' + p.amount + '</div>' +
            '<button class="btn-topup" onclick="requestTopUp(' + p.id + ', ' + p.amount + ', \'' + p.stripe_link + '\')">Top Up</button>' +
            '</div>';
        }).join('');
      }
async function requestTopUp(packageId, amount, stripeLink) {
  var profileResult = await sbClient.from('profiles').select('credit_balance').eq('id', currentUserId).single();
  var currentBalance = profileResult.data ? parseFloat(profileResult.data.credit_balance || 0) : 0;
  if (currentBalance + amount > 50) {
    alert('This top-up would take your balance over the £50 limit. Your current balance is £' + currentBalance.toFixed(2) + ', so you can top up a maximum of £' + (50 - currentBalance).toFixed(2) + ' right now.');
    return;
  }
  var result = await sbClient.from('credit_top_ups').insert([{
    player_id: currentUserId,
    package_id: packageId,
    requested_amount: amount
  }]);
  if (result.error) {
    alert('Error recording your request: ' + result.error.message);
    return;
  }
  if (stripeLink) {
    window.open(stripeLink, '_blank');
  }
  loadHistory();
}
      async function loadHistory() {
        var result = await sbClient.from('credit_top_ups').select('*, credit_topup_packages(amount)').eq('player_id', currentUserId).order('created_at', { ascending: false });
        var container = document.getElementById('historyList');
        if (!result.data || !result.data.length) { container.innerHTML = '<p class="coming-soon">No top-ups yet.</p>'; return; }
        container.innerHTML = result.data.map(function(t) {
          var pkg = t.credit_topup_packages || {};
          var amount = pkg.amount != null ? pkg.amount : t.requested_amount;
          var statusHtml = t.paid ? '<span class="status-paid">✓ Paid</span>' : '<span class="status-pending">Awaiting confirmation</span>';
          return '<div class="history-item">' +
            '<div>£' + amount + ' — ' + new Date(t.created_at).toLocaleDateString('en-GB') + '</div>' +
            statusHtml +
            '</div>';
        }).join('');
      }
      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }
      window.addEventListener('load', function() {
        checkAuth();
        init();
      });
    </script>
  </body>
</html>
