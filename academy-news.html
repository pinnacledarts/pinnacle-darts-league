<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | Pinnacle Academy</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 500; }      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
.hamburger { display: block; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; margin-left: auto; }
nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: #000000; z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
nav.open { display: flex; }
nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #333333; border-radius: 0; min-width: unset; padding: 14px 24px; font-size: 1em; margin: 0; }
nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #222222; color: #ffffff; }
nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #333333; }      main { padding: 40px; max-width: 900px; margin: 0 auto; }
      .back-link { display: inline-block; margin-bottom: 20px; color: #111111; text-decoration: none; font-size: 0.9em; }
      .back-link:hover { text-decoration: underline; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; margin-bottom: 20px; }
      .news-accordion { margin-bottom: 40px; }
      .news-item { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
      .news-item-title { padding: 18px 24px; font-weight: bold; font-size: 1.05em; cursor: pointer; text-align: center; }
      .news-item-title:hover { background-color: #f9f9f9; }
      .news-item-body { display: none; padding: 0 24px 24px; }
      .news-item-body.open { display: block; }
      .news-item-body img { width: 100%; border-radius: 6px; margin-bottom: 16px; display: block; }
      .news-date { font-size: 0.85em; color: #888888; margin-bottom: 12px; }
      .news-content { color: #333333; line-height: 1.6; white-space: pre-wrap; }
      .like-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
      .like-btn { background: none; border: 1px solid #dddddd; border-radius: 20px; padding: 6px 16px; cursor: pointer; font-size: 0.9em; }
      .like-btn.liked { background-color: #fff0f0; border-color: #ffcccc; color: #cc0000; }
      .coming-soon { text-align: center; padding: 40px 20px; color: #aaaaaa; font-size: 1em; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        .header-buttons { margin-left: 0; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
        .btn-switch, .btn-login, .btn-logout { font-size: 0.8em; padding: 6px 12px; min-width: 140px; }
        .hamburger { display: block; }
        main { padding: 24px 20px; }
        h2 { font-size: 1.3em; }
      }
    </style>
  </head>
  <body>

<header>
  <img src="logo.png" alt="Pinnacle Darts Logo">
  <div>
    <h1>Pinnacle Academy</h1>
    <p>Official Academy Website</p>
  </div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <nav id="mainNav">
    <a href="index.html" class="btn-switch" style="border:none;min-width:unset;text-align:left;">Switch to Online</a>
    <div id="authButtons" style="padding:14px 24px;"></div>
  </nav>
</header>

    <main>
      <a href="academy.html" class="back-link">← Back to Academy</a>

      <h2>Latest News</h2>
      <div class="news-accordion" id="newsList"><p class="loading">Loading news...</p></div>

      <h2>Latest Announcements</h2>
      <div class="news-accordion" id="announcementsList"><p class="loading">Loading announcements...</p></div>
    </main>

    <script>
      let currentUserId = null;
      let allNewsLikes = {};

      async function loadArticles() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session) currentUserId = session.user.id;

        const { data: allArticles, error } = await sbClient
          .from('news')
          .select('*')
          .or('section.eq.academy,section.eq.both')
          .order('article_date', { ascending: false });

        if (error) {
          document.getElementById('newsList').innerHTML = '<p class="coming-soon">Error loading news.</p>';
          return;
        }

        const today = new Date();
        const active = (allArticles || []).filter(a => {
          const artDate = new Date(a.article_date || a.created_at);
          const expiry = new Date(artDate);
          expiry.setDate(expiry.getDate() + (a.duration_days || 30));
          return expiry >= today;
        });

        const newsArticles = active.filter(a => a.tag !== 'announcement');
        const announcementArticles = active.filter(a => a.tag === 'announcement');

        const { data: likesData } = await sbClient.from('news_likes').select('*');
        (likesData || []).forEach(l => {
          if (!allNewsLikes[l.news_id]) allNewsLikes[l.news_id] = [];
          allNewsLikes[l.news_id].push(l.player_id);
        });

        renderList('newsList', newsArticles);
        renderList('announcementsList', announcementArticles);
      }

      function renderList(containerId, articles) {
        const container = document.getElementById(containerId);
        if (!articles.length) {
          container.innerHTML = '<p class="coming-soon">Nothing here yet — check back soon!</p>';
          return;
        }

        container.innerHTML = articles.map(a => {
          const dateStr = new Date(a.article_date || a.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
          const likes = allNewsLikes[a.id] || [];
          const userLiked = currentUserId && likes.includes(currentUserId);
          return `
            <div class="news-item">
              <div class="news-item-title" onclick="toggleArticle(${a.id})">${a.title}</div>
              <div class="news-item-body" id="article-${a.id}">
                ${a.image_url ? `<img src="${a.image_url}" alt="${a.title}" />` : ''}
                <div class="news-date">${dateStr}</div>
                <div class="news-content">${a.content || ''}</div>
                <div class="like-row">
                  <button class="like-btn ${userLiked ? 'liked' : ''}" id="like-btn-${a.id}" onclick="toggleLike(${a.id}, event)">
                    ${userLiked ? '❤️ Liked' : '🤍 Like'} (<span id="like-count-${a.id}">${likes.length}</span>)
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function toggleArticle(id) {
        const body = document.getElementById('article-' + id);
        body.classList.toggle('open');
      }

      async function toggleLike(newsId, event) {
        event.stopPropagation();
        if (!currentUserId) { window.location.href = 'login.html'; return; }

        const likes = allNewsLikes[newsId] || [];
        const alreadyLiked = likes.includes(currentUserId);

        if (alreadyLiked) {
          await sbClient.from('news_likes').delete().eq('news_id', newsId).eq('player_id', currentUserId);
          allNewsLikes[newsId] = likes.filter(id => id !== currentUserId);
        } else {
          await sbClient.from('news_likes').insert([{ news_id: newsId, player_id: currentUserId }]);
          allNewsLikes[newsId] = [...likes, currentUserId];
        }

        const btn = document.getElementById('like-btn-' + newsId);
        const nowLiked = allNewsLikes[newsId].includes(currentUserId);
        btn.className = 'like-btn' + (nowLiked ? ' liked' : '');
        btn.innerHTML = (nowLiked ? '❤️ Liked' : '🤍 Like') + ' (<span id="like-count-' + newsId + '">' + allNewsLikes[newsId].length + '</span>)';
      }

      function toggleMenu() {
        document.getElementById('mainNav') && document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', () => {
        checkAuth();
        loadArticles();
      });
    </script>

  </body>
</html>
