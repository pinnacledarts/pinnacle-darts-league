<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --pd-bg-dark: #0a0a0a;
        --pd-surface: #ffffff;
        --pd-text-dark: #111111;
        --pd-text-muted: #767676;
        --pd-text-light: #ffffff;
        --pd-text-light-muted: #8a8a8a;
        --pd-border: #ececec;
        --pd-border-strong: #dcdcdc;
        --pd-radius-card: 14px;
        --pd-radius-btn: 9px;
        --pd-shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
      }
      body { margin: 0; font-family: Arial, sans-serif; background-color: var(--pd-bg-dark); color: var(--pd-text-light); }
      header { background-color: var(--pd-bg-dark); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 500; }
      header .brand { display: flex; align-items: center; gap: 10px; }
      header img { height: 34px; width: 34px; border-radius: 9px; background: #ffffff; padding: 2px; }
      header .brand-name { color: var(--pd-text-light); font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
      .hamburger { display: block; background: none; border: none; color: var(--pd-text-light); font-size: 1.6em; cursor: pointer; padding: 0; line-height: 1; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: var(--pd-bg-dark); z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      nav.open { display: flex; }
      nav a { color: var(--pd-text-light); text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #222222; }
      nav a:hover { background-color: #1a1a1a; }
      nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #222222; border-radius: 0; padding: 14px 24px; font-size: 1em; margin: 0; color: var(--pd-text-light); background: none; cursor: pointer; font-family: Arial, sans-serif; }
      nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #1a1a1a; }
      nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #222222; color: var(--pd-text-light); font-size: 0.9em; }
      .hero { position: relative; padding: 8px 28px 44px; overflow: hidden; }
      .hero-watermark { position: fixed; bottom: -120px; right: -80px; height: 520px; width: 520px; object-fit: contain; opacity: 0.15; pointer-events: none; z-index: 0; }
      .hero-kicker { position: relative; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; color: var(--pd-text-light-muted); margin-bottom: 10px; text-transform: uppercase; }
      .hero-title { position: relative; font-size: 26px; font-weight: bold; color: var(--pd-text-light); line-height: 1.25; margin: 0; max-width: 460px; }
      main { padding: 8px 28px 40px; max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
      .search-box { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 20px; margin-bottom: 20px; }
      .search-box label { font-weight: bold; display: block; margin-bottom: 10px; color: var(--pd-text-dark); font-size: 13px; }
      .search-controls { display: flex; gap: 12px; flex-wrap: wrap; }
      .search-controls input, .search-controls select { flex: 1; min-width: 140px; padding: 10px 14px; border: 1px solid var(--pd-border-strong); border-radius: var(--pd-radius-btn); font-size: 1em; background-color: #f9f9f9; color: var(--pd-text-dark); font-family: Arial, sans-serif; }
      .search-controls input:focus, .search-controls select:focus { outline: none; border-color: var(--pd-text-dark); }
      .profile-card { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 24px; margin-bottom: 20px; color: var(--pd-text-dark); }
      .profile-top { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
      .player-avatar { width: 80px; height: 80px; border-radius: 50%; background-color: var(--pd-text-dark); color: var(--pd-text-light); font-size: 2em; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
      .profile-info h3 { margin: 0 0 4px; font-size: 1.5em; }
      .profile-info .username { color: var(--pd-text-muted); font-size: 0.9em; margin-bottom: 4px; }
      .profile-info .location { font-size: 0.85em; color: var(--pd-text-muted); }
      .key-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
      .stat-box { background-color: #f9f9f9; border-radius: var(--pd-radius-btn); padding: 16px; text-align: center; }
      .stat-box .stat-label { font-size: 11px; color: var(--pd-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
      .stat-box .stat-value { font-size: 1.6em; font-weight: bold; }
      .details-section { border-top: 1px solid var(--pd-border); padding-top: 16px; }
      .details-section h4 { font-size: 14px; margin: 0 0 12px; font-weight: bold; }
      .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f5f5f5; font-size: 0.9em; }
      .detail-row:last-child { border-bottom: none; }
      .detail-label { color: var(--pd-text-muted); flex-shrink: 0; }
      .detail-value-wrap { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex: 1; }
      .detail-value { font-weight: bold; text-align: right; }
      .pencil-btn { background: none; border: none; cursor: pointer; font-size: 0.85em; color: #aaaaaa; padding: 2px 4px; }
      .pencil-btn:hover { color: var(--pd-text-dark); }
      .edit-input { border: 1px solid var(--pd-border-strong); border-radius: 4px; padding: 4px 8px; font-size: 0.9em; font-family: Arial, sans-serif; width: 150px; }
      .edit-input:focus { outline: none; border-color: var(--pd-text-dark); }
      .save-btn { background-color: var(--pd-text-dark); color: var(--pd-text-light); border: none; border-radius: 4px; padding: 4px 10px; font-size: 0.85em; cursor: pointer; }
      .save-btn:hover { background-color: #333333; }
      .cancel-btn { background: none; border: 1px solid var(--pd-border-strong); border-radius: 4px; padding: 4px 10px; font-size: 0.85em; cursor: pointer; }
      .cancel-btn:hover { background-color: #f5f5f5; }
      .loading { text-align: center; padding: 40px; color: var(--pd-text-light-muted); }
      @media (max-width: 700px) {
        header { padding: 14px 20px; }
        .hero { padding: 8px 20px 36px; }
        .hero-title { font-size: 22px; }
        .hero-watermark { height: 420px; width: 420px; bottom: -90px; right: -70px; }
        main { padding: 8px 20px 32px; }
        .key-stats { grid-template-columns: 1fr 1fr; }
        .profile-top { gap: 14px; }
        .player-avatar { width: 64px; height: 64px; font-size: 1.6em; }
      }
    </style>
  </head>
  <body>
<header>
  <div class="brand">
    <img src="logo.png" alt="Pinnacle Darts Logo">
    <div class="brand-name">Pinnacle Darts League</div>
  </div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <nav id="mainNav">
    <a href="index.html">Home</a>
    <a href="leagues.html">Leagues</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="players.html">Players</a>
    <a href="academy.html" class="btn-switch" style="border:none;text-align:left;">Switch to Academy</a>
    <div id="authButtons" style="padding:14px 24px;"></div>
  </nav>
</header>
<div class="hero">
  <img src="logo-watermark.png" alt="" class="hero-watermark">
  <div class="hero-kicker">Players</div>
  <div class="hero-title">Browse the roster.</div>
</div>
    <main>
      <div class="search-box">
        <label>View player</label>
        <div class="search-controls">
          <input type="text" id="searchInput" placeholder="Search by name or username..." oninput="filterPlayers()" />
          <select id="playerDropdown" onchange="selectFromDropdown()">
            <option value="">-- Select a player --</option>
          </select>
        </div>
      </div>
      <div id="profileCard" class="profile-card" style="display:none;">
        <div class="profile-top">
          <div class="avatar-wrap" style="position:relative;">
            <div class="player-avatar" id="profileAvatar"></div>
            <button class="avatar-edit-btn" id="avatarEditBtn" onclick="document.getElementById('avatarFileInput').click()" style="display:none;position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;background-color:#111111;color:#ffffff;border:2px solid #ffffff;cursor:pointer;font-size:0.75em;">✏️</button>
            <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="uploadAvatar(event)" />
          </div>
          <div class="profile-info">
            <div style="display:flex;align-items:center;gap:8px;">
              <h3 id="profileName" style="margin:0;"></h3>
              <button class="pencil-btn" id="pencil-full_name" onclick="startEdit('full_name')" style="display:none;">✏️</button>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="username" id="profileUsername"></div>
              <button class="pencil-btn" id="pencil-username" onclick="startEdit('username')" style="display:none;">✏️</button>
            </div>
            <div class="location" id="profileLocation"></div>
          </div>
        </div>
        <div class="key-stats">
          <div class="stat-box"><div class="stat-label">Average</div><div class="stat-value" id="profileAverage">-</div></div>
          <div class="stat-box"><div class="stat-label">Wins</div><div class="stat-value" id="profileWins">-</div></div>
          <div class="stat-box"><div class="stat-label">Matches</div><div class="stat-value" id="profileMatches">-</div></div>
        </div>
        <div class="details-section">
          <h4>Player details</h4>
          <div class="detail-row">
            <span class="detail-label">Member since</span>
            <div class="detail-value-wrap"><span class="detail-value" id="profileMemberSince">-</span></div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Highest checkout</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profileCheckout">-</span>
              <button class="pencil-btn" id="pencil-highest_checkout" onclick="startEdit('highest_checkout')" style="display:none;">✏️</button>
            </div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Hometown</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profileHometown">-</span>
              <button class="pencil-btn" id="pencil-hometown" onclick="startEdit('hometown')" style="display:none;">✏️</button>
            </div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Darts brand</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profileBrand">-</span>
              <button class="pencil-btn" id="pencil-darts_brand" onclick="startEdit('darts_brand')" style="display:none;">✏️</button>
            </div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Dart weight</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profileWeight">-</span>
              <button class="pencil-btn" id="pencil-dart_weight" onclick="startEdit('dart_weight')" style="display:none;">✏️</button>
            </div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Walkout song</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profileWalkout">-</span>
              <button class="pencil-btn" id="pencil-walkout_song" onclick="startEdit('walkout_song')" style="display:none;">✏️</button>
            </div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Favourite player</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profileFavPlayer">-</span>
              <button class="pencil-btn" id="pencil-favourite_player" onclick="startEdit('favourite_player')" style="display:none;">✏️</button>
            </div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Platform</span>
            <div class="detail-value-wrap">
              <span class="detail-value" id="profilePlatform">-</span>
              <button class="pencil-btn" id="pencil-platform" onclick="startEdit('platform')" style="display:none;">✏️</button>
            </div>
          </div>
        </div>
      </div>
      <div id="loadingMsg" class="loading">Loading players...</div>
    </main>
    <script>
      let allPlayers = [];
      let currentUserId = null;
      let currentProfileId = null;
      let isCurrentUserAdmin = false;
      const fieldLabels = {
        highest_checkout: 'profileCheckout',
        hometown: 'profileHometown',
        darts_brand: 'profileBrand',
        dart_weight: 'profileWeight',
        walkout_song: 'profileWalkout',
        favourite_player: 'profileFavPlayer',
        full_name: 'profileName',
        username: 'profileUsername',
        platform: 'profilePlatform'
      };
      async function loadPlayers() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session) {
          currentUserId = session.user.id;
          const { data: profile } = await sbClient.from('profiles').select('is_admin').eq('id', currentUserId).single();
          isCurrentUserAdmin = profile ? profile.is_admin : false;
        }
const { data, error } = await sbClient
          .from('profiles')
          .select('*')
          .or('is_bye.is.null,is_bye.eq.false')
          .order('full_name', { ascending: true });
        if (error) {
          document.getElementById('loadingMsg').textContent = 'Error loading players.';
          return;
        }
        allPlayers = data;
        document.getElementById('loadingMsg').style.display = 'none';
        const dropdown = document.getElementById('playerDropdown');
        dropdown.innerHTML = '<option value="">-- Select a player --</option>';
        data.forEach(p => {
          const option = document.createElement('option');
          option.value = p.id;
          option.textContent = p.full_name || p.username;
          dropdown.appendChild(option);
        });
        if (currentUserId) {
          const ownProfile = data.find(p => p.id === currentUserId);
          if (ownProfile) {
            showPlayer(ownProfile);
            document.getElementById('searchInput').value = ownProfile.full_name || ownProfile.username;
            document.getElementById('playerDropdown').value = ownProfile.id;
          } else if (data.length > 0) {
            showPlayer(data[0]);
          }
        } else if (data.length > 0) {
          showPlayer(data[0]);
        }
      }
      function showPlayer(p) {
        currentProfileId = p.id;
        const isOwnProfile = currentUserId && (currentUserId === p.id || isCurrentUserAdmin);
        const avatarEl = document.getElementById('profileAvatar');
        if (p.avatar_url) {
          avatarEl.textContent = '';
          avatarEl.style.backgroundImage = `url(${p.avatar_url})`;
        } else {
          avatarEl.style.backgroundImage = '';
          avatarEl.textContent = (p.full_name || p.username || '?')[0].toUpperCase();
        }
        document.getElementById('profileCard').style.display = 'block';
        document.getElementById('profileName').textContent = p.full_name || p.username || '-';
        document.getElementById('profileUsername').textContent = p.username ? '@' + p.username : '-';
        document.getElementById('profileLocation').textContent = p.hometown || '-';
document.getElementById('profileAverage').textContent = p.average || p.starter_average || '-';
        document.getElementById('profileWins').textContent = p.wins || '-';
        document.getElementById('profileMatches').textContent = p.matches || '-';
        document.getElementById('profileMemberSince').textContent = p.created_at ? new Date(p.created_at).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : '-';
        document.getElementById('profileCheckout').textContent = p.highest_checkout || '-';
        document.getElementById('profileHometown').textContent = p.hometown || '-';
        document.getElementById('profileBrand').textContent = p.darts_brand || '-';
        document.getElementById('profileWeight').textContent = p.dart_weight || '-';
        document.getElementById('profileWalkout').textContent = p.walkout_song || '-';
        document.getElementById('profileFavPlayer').textContent = p.favourite_player || '-';
        document.getElementById('profilePlatform').textContent = p.platform ? p.platform.charAt(0).toUpperCase() + p.platform.slice(1) : '-';
        Object.keys(fieldLabels).forEach(field => {
          const pencil = document.getElementById('pencil-' + field);
          if (pencil) pencil.style.display = isOwnProfile ? 'inline' : 'none';
        });
        document.getElementById('avatarEditBtn').style.display = isOwnProfile ? 'flex' : 'none';
        document.getElementById('avatarEditBtn').style.alignItems = 'center';
        document.getElementById('avatarEditBtn').style.justifyContent = 'center';
      }
      function startEdit(field) {
        const valueEl = document.getElementById(fieldLabels[field]);
        let currentValue = valueEl.textContent === '-' ? '' : valueEl.textContent;
        if (field === 'username' && currentValue.startsWith('@')) { currentValue = currentValue.slice(1); }
        const wrap = valueEl.parentElement;
        if (field === 'platform') {
          const player = allPlayers.find(p => p.id === currentProfileId);
          const rawValue = player ? player.platform : '';
          wrap.innerHTML = `
            <select class="edit-input" id="edit-platform">
              <option value="dartcounter" ${rawValue === 'dartcounter' ? 'selected' : ''}>Dartcounter</option>
              <option value="scolia" ${rawValue === 'scolia' ? 'selected' : ''}>Scolia</option>
              <option value="both" ${rawValue === 'both' ? 'selected' : ''}>Both</option>
            </select>
            <button class="save-btn" onclick="saveEdit('platform')">Save</button>
            <button class="cancel-btn" onclick="cancelEdit('platform', '${currentValue}')">Cancel</button>
          `;
          return;
        }
        wrap.innerHTML = `
          <input class="edit-input" id="edit-${field}" value="${currentValue}" />
          <button class="save-btn" onclick="saveEdit('${field}')">Save</button>
          <button class="cancel-btn" onclick="cancelEdit('${field}', '${currentValue}')">Cancel</button>
        `;
        document.getElementById('edit-' + field).focus();
      }
      async function saveEdit(field) {
        const input = document.getElementById('edit-' + field);
        const newValue = input.value.trim();
        const update = {};
        update[field] = newValue || null;
        const { error } = await sbClient
          .from('profiles')
          .update(update)
          .eq('id', currentProfileId);
        if (error) {
          alert('Error saving. Please try again.');
          return;
        }
        const player = allPlayers.find(p => p.id === currentProfileId);
        if (player) player[field] = newValue;
        const wrap = document.getElementById('edit-' + field).parentElement;
        let displayValue = newValue || '-';
        if (field === 'username' && newValue) { displayValue = '@' + newValue; }
        if (field === 'platform' && newValue) { displayValue = newValue.charAt(0).toUpperCase() + newValue.slice(1); }
        const spanClass = (field === 'full_name' || field === 'username') ? '' : 'class="detail-value"';
        wrap.innerHTML = `
          <span ${spanClass} id="${fieldLabels[field]}">${displayValue}</span>
          <button class="pencil-btn" id="pencil-${field}" onclick="startEdit('${field}')">✏️</button>
        `;
      }
      function cancelEdit(field, originalValue) {
        const wrap = document.getElementById('edit-' + field).parentElement;
        let displayValue = originalValue || '-';
        if (field === 'username' && originalValue) { displayValue = '@' + originalValue; }
        if (field === 'platform' && originalValue) { displayValue = originalValue.charAt(0).toUpperCase() + originalValue.slice(1); }
        const spanClass = (field === 'full_name' || field === 'username') ? '' : 'class="detail-value"';
        wrap.innerHTML = `
          <span ${spanClass} id="${fieldLabels[field]}">${displayValue}</span>
          <button class="pencil-btn" id="pencil-${field}" onclick="startEdit('${field}')">✏️</button>
        `;
      }
      async function uploadAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const fileExt = file.name.split('.').pop();
        const fileName = `${currentProfileId}.${fileExt}`;
        const { error: uploadError } = await sbClient.storage
          .from('avatars')
          .upload(fileName, file, { upsert: true });
        if (uploadError) {
          alert('Error uploading photo: ' + uploadError.message);
          return;
        }
        const { data: urlData } = sbClient.storage.from('avatars').getPublicUrl(fileName);
        const avatarUrl = urlData.publicUrl + '?t=' + Date.now();
        const { error: updateError } = await sbClient
          .from('profiles')
          .update({ avatar_url: avatarUrl })
          .eq('id', currentProfileId);
        if (updateError) {
          alert('Photo uploaded but failed to save. Please try again.');
          return;
        }
        const player = allPlayers.find(p => p.id === currentProfileId);
        if (player) player.avatar_url = avatarUrl;
        document.getElementById('profileAvatar').textContent = '';
        document.getElementById('profileAvatar').style.backgroundImage = `url(${avatarUrl})`;
      }
      function filterPlayers() {
        const val = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!val) return;
        const match = allPlayers.find(p =>
          (p.full_name && p.full_name.toLowerCase().startsWith(val)) ||
          (p.username && p.username.toLowerCase().startsWith(val))
        );
        if (match) {
          document.getElementById('playerDropdown').value = match.id;
          showPlayer(match);
        }
      }
      function selectFromDropdown() {
        const id = document.getElementById('playerDropdown').value;
        const player = allPlayers.find(p => p.id === id);
        if (player) {
          document.getElementById('searchInput').value = player.full_name || player.username;
          showPlayer(player);
        }
      }
      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }
      window.addEventListener('load', async () => {
        checkAuth();
        loadPlayers();
      });
    </script>
  </body>
</html>
