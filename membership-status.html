<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Status | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      main { padding: 60px 40px; max-width: 500px; margin: 0 auto; text-align: center; }
      .status-box { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 10px; padding: 40px 30px; }
      .status-icon { font-size: 3em; margin-bottom: 16px; }
      h2 { margin: 0 0 12px; }
      p { color: #555555; line-height: 1.6; }
      .btn-logout-page { display: inline-block; margin-top: 24px; background-color: #111111; color: #ffffff; border: none; padding: 10px 24px; border-radius: 4px; font-size: 0.95em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-logout-page:hover { background-color: #333333; }
      @media (max-width: 700px) {
        header { padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        main { padding: 40px 20px; }
      }
    </style>
  </head>
  <body>

    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
    </header>

    <main>
      <div class="status-box" id="statusBox">
        <p>Loading...</p>
      </div>
    </main>

    <script>
      window.addEventListener('load', async () => {
        const { data: { session } } = await sbClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }

        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const box = document.getElementById('statusBox');

        if (status === 'denied') {
          box.innerHTML = `
            <div class="status-icon">🚫</div>
            <h2>Access Denied</h2>
            <p>Unfortunately your Academy membership request was not approved. If you believe this is a mistake, please get in touch with us directly.</p>
            <button class="btn-logout-page" onclick="doLogout()">Logout</button>
          `;
        } else {
          box.innerHTML = `
            <div class="status-icon">⏳</div>
            <h2>Membership Pending</h2>
            <p>Thanks for registering! Your Academy membership is currently awaiting approval for safeguarding purposes. You'll be able to log in once it's been reviewed.</p>
            <button class="btn-logout-page" onclick="doLogout()">Logout</button>
          `;
        }
      });

      async function doLogout() {
        await sbClient.auth.signOut();
        window.location.href = 'index.html';
      }
    </script>

  </body>
</html>
