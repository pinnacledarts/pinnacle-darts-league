<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merch | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 500; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
      .hamburger { display: block; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; margin-left: auto; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: #000000; z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      nav.open { display: flex; }
      nav a { color: #ffffff; text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #333333; }
      nav a:hover { background-color: #222222; }
      nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #333333; border-radius: 0; min-width: unset; padding: 14px 24px; font-size: 1em; margin: 0; }
      nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #222222; color: #ffffff; }
      nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #333333; }
      main { padding: 40px; max-width: 1200px; margin: 0 auto; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; }
      .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
      .listing-card { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; overflow: hidden; }
      .listing-image { width: 100%; height: 220px; background-color: #eeeeee; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: #aaaaaa; font-size: 0.9em; position: relative; }
      .listing-body { padding: 16px; }
      .listing-title { font-weight: bold; font-size: 1.1em; margin-bottom: 6px; }
      .listing-price { font-size: 1.2em; font-weight: bold; color: #111111; margin-bottom: 12px; }
      .listing-actions select { width: 100%; padding: 8px; border: 1px solid #dddddd; border-radius: 4px; font-size: 0.9em; margin-bottom: 10px; font-family: Arial, sans-serif; }
      .btn-buy { display: block; width: 100%; text-align: center; background-color: #000000; color: #ffffff; border: none; padding: 10px; border-radius: 4px; font-size: 0.95em; cursor: pointer; text-decoration: none; font-family: Arial, sans-serif; }
      .btn-buy:hover { background-color: #333333; }
      .coming-soon { text-align: center; padding: 60px 20px; color: #aaaaaa; font-size: 1.1em; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        main { padding: 24px 16px; }
        h2 { font-size: 1.3em; }
      }
    </style>
  </head>
  <body>

    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <nav id="mainNav">
        <a href="index.html">Home</a>
        <a href="leagues.html">Leagues</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="players.html">Players</a>
        <a href="swap-sell.html">Swap / Sell</a>
        <a href="shirt-builder.html">Shirt Builder</a>
        <a href="merch.html">Merch</a>
        <a href="academy.html" class="btn-switch" style="border:none;min-width:unset;text-align:left;">Switch to Academy</a>
        <div id="authButtons" style="padding:14px 24px;"></div>
      </nav>
    </header>

    <main>
      <h2>Merch</h2>
      <div id="listingsGrid" class="listings-grid"><p class="loading">Loading merch...</p></div>
      <p style="text-align:center;margin-top:30px;"><a href="terms.html" style="color:#555;font-size:0.9em;">View Terms & Conditions →</a></p>
    </main>

    <script>
      var currentUserId = null;
      var allMerchListings = [];

      async function init() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session) { currentUserId = session.user.id; }
        loadMerch();
      }

      async function loadMerch() {
        var result = await sbClient.from('merch_listings').select('*').eq('active', true).order('created_at', { ascending: false });
        var container = document.getElementById('listingsGrid');
        allMerchListings = result.data || [];
        if (!allMerchListings.length) { container.innerHTML = '<p class="coming-soon">No merch items available right now — check back soon!</p>'; return; }
        container.innerHTML = allMerchListings.map(renderMerchCard).join('');
      }

      function renderMerchCard(m) {
        var images = m.image_urls || [];
        var imageHtml;
        if (images.length > 1) {
          imageHtml = '<div class="listing-image" style="background-image:url(' + images[0] + ');cursor:pointer;" data-index="0" data-listing-id="' + m.id + '" onclick="cycleMerchImage(this)">' +
            '<span style="position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.75em;">1 / ' + images.length + '</span>' +
            '</div>';
        } else if (images.length === 1) {
          imageHtml = '<div class="listing-image" style="background-image:url(' + images[0] + ');"></div>';
        } else {
          imageHtml = '<div class="listing-image">No image</div>';
        }

        var optionHtml = '';
        if (m.option_label && m.option_choices && m.option_choices.length) {
          optionHtml = '<select id="merchOption-' + m.id + '"><option value="">-- Select ' + m.option_label + ' --</option>' +
            m.option_choices.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') + '</select>';
        }

        var buyBtn = currentUserId
          ? '<button class="btn-buy" onclick="handleBuy(' + m.id + ')">Buy Now</button>'
          : '<a href="login.html" class="btn-buy">Login to Buy</a>';

        return '<div class="listing-card">' +
          imageHtml +
          '<div class="listing-body">' +
          '<div class="listing-title">' + m.title + '</div>' +
          '<div class="listing-price">£' + (m.price != null ? m.price : '-') + '</div>' +
          '<div class="listing-actions">' + optionHtml + buyBtn + '</div>' +
          '</div></div>';
      }

      function cycleMerchImage(el) {
        var listingId = parseInt(el.getAttribute('data-listing-id'));
        var listing = allMerchListings.find(function(m) { return m.id === listingId; });
        if (!listing || !listing.image_urls) { return; }
        var idx = parseInt(el.getAttribute('data-index'));
        idx = (idx + 1) % listing.image_urls.length;
        el.setAttribute('data-index', idx);
        el.style.backgroundImage = 'url(' + listing.image_urls[idx] + ')';
        var counter = el.querySelector('span');
        if (counter) { counter.textContent = (idx + 1) + ' / ' + listing.image_urls.length; }
      }

      async function handleBuy(id) {
        var listing = allMerchListings.find(function(m) { return m.id === id; });
        if (!listing) { return; }

        var selectedOption = null;
        if (listing.option_label) {
          var select = document.getElementById('merchOption-' + id);
          selectedOption = select ? select.value : '';
          if (!selectedOption) {
            alert('Please select a ' + listing.option_label + ' before buying.');
            return;
          }
        }

        var result = await sbClient.from('merch_orders').insert([{
          listing_id: id,
          buyer_id: currentUserId,
          selected_option: selectedOption
        }]);

        if (result.error) {
          alert('Error recording your order: ' + result.error.message);
          return;
        }

        if (listing.stripe_link) {
          window.open(listing.stripe_link, '_blank');
        } else {
          alert('This item does not have a payment link set up yet — please contact an admin.');
        }
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', function() {
        checkAuth();
        init();
      });
    </script>

  </body>
</html>
