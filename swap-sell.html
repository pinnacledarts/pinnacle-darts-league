<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap / Sell | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 500; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
      .hamburger { display: block; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; margin-left: auto; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: #000000; z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      nav.open { display: flex; }
      nav a { color: #ffffff; text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #333333; }
      nav a:hover { background-color: #222222; }
      nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #333333; border-radius: 0; min-width: unset; padding: 14px 24px; font-size: 1em; margin: 0; }
      nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #222222; color: #ffffff; }
      nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #333333; }
      main { padding: 40px; max-width: 1200px; margin: 0 auto; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; }
      .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
      .btn { padding: 10px 24px; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-primary { background-color: #000000; color: #ffffff; }
      .btn-primary:hover { background-color: #333333; }
      .btn-secondary { background-color: #ffffff; color: #111111; border: 1px solid #dddddd; }
      .btn-secondary:hover { background-color: #f5f5f5; }
      .btn-danger { background-color: #ffffff; color: #cc0000; border: 1px solid #cc0000; }
      .btn-danger:hover { background-color: #fff0f0; }
      .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
      .listing-card { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; overflow: hidden; }
      .listing-image { width: 100%; height: 180px; background-color: #eeeeee; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: #aaaaaa; font-size: 0.9em; }
      .listing-body { padding: 16px; }
      .listing-title { font-weight: bold; font-size: 1.1em; margin-bottom: 6px; }
      .listing-meta { color: #555555; font-size: 0.9em; margin-bottom: 8px; }
      .listing-badges { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
      .listing-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
      .badge-price { background-color: #eeeeee; color: #111111; }
      .badge-swap { background-color: #f0fff0; color: #006600; border: 1px solid #cceecc; }
      .listing-desc { color: #444444; font-size: 0.9em; line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; }
      .listing-seller { color: #888888; font-size: 0.85em; margin-bottom: 12px; }
      .listing-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .whatsapp-btn { display: inline-flex; align-items: center; gap: 4px; background-color: #25D366; color: #ffffff; padding: 8px 14px; border-radius: 20px; font-size: 0.85em; text-decoration: none; font-weight: bold; }
      .form-box { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
      .form-group { margin-bottom: 16px; }
      .form-group label { display: block; font-size: 0.9em; font-weight: bold; margin-bottom: 6px; color: #333333; }
      .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #dddddd; border-radius: 4px; font-size: 1em; background-color: #f9f9f9; font-family: Arial, sans-serif; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .coming-soon { text-align: center; padding: 60px 20px; color: #aaaaaa; font-size: 1.1em; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      .success-msg { background-color: #f0fff0; border: 1px solid #cceecc; color: #006600; padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; display: none; font-size: 0.9em; }
      .error-msg { background-color: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; display: none; font-size: 0.9em; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        main { padding: 24px 20px; }
        h2 { font-size: 1.3em; }
        .form-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>

    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <nav id="mainNav">
        <a href="index.html">Home</a>
        <a href="leagues.html">Leagues</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="players.html">Players</a>
        <a href="swap-sell.html">Swap / Sell</a>
        <a href="academy.html" class="btn-switch" style="border:none;min-width:unset;text-align:left;">Switch to Academy</a>
        <div id="authButtons" style="padding:14px 24px;"></div>
      </nav>
    </header>

    <main>
      <h2>Swap / Sell</h2>
      <div class="top-bar">
        <p style="color:#666;margin:0;">Listings automatically expire after 14 days.</p>
        <button class="btn btn-primary" id="postListingBtn" onclick="openListingForm()" style="display:none;">+ Post a Listing</button>
      </div>

      <div id="listingFormContainer"></div>

      <div id="listingsGrid" class="listings-grid"><p class="loading">Loading listings...</p></div>
      <p style="text-align:center;margin-top:30px;"><a href="terms.html" style="color:#555;font-size:0.9em;">View Terms & Conditions →</a></p>
    </main>

    <script>
      var currentUserId = null;
      var isCurrentUserAdmin = false;
      var currentUserPhone = null;
      var allListings = [];
      var editingListingId = null;

      function cycleListingImage(el) {
  var listingId = parseInt(el.getAttribute('data-listing-id'));
  var listing = allListings.find(function(l) { return l.id === listingId; });
  if (!listing || !listing.image_urls) { return; }

  var idx = parseInt(el.getAttribute('data-index'));
  idx = (idx + 1) % listing.image_urls.length;
  el.setAttribute('data-index', idx);
  el.style.backgroundImage = 'url(' + listing.image_urls[idx] + ')';

  var counter = el.querySelector('span');
  if (counter) { counter.textContent = (idx + 1) + ' / ' + listing.image_urls.length; }
}
      
      function buildWhatsAppLink(phone) {
        if (!phone) { return null; }
        var hasPlus = phone.trim().startsWith('+');
        var digits = phone.replace(/[^\d]/g, '');
        if (!digits) { return null; }
        if (!hasPlus && digits.startsWith('0')) {
          digits = '44' + digits.substring(1);
        }
        return 'https://wa.me/' + digits;
      }

      async function init() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session) {
          currentUserId = session.user.id;
          const { data: profile } = await sbClient.from('profiles').select('is_admin, phone').eq('id', currentUserId).single();
          if (profile) {
            isCurrentUserAdmin = profile.is_admin;
            currentUserPhone = profile.phone;
          }
          document.getElementById('postListingBtn').style.display = 'inline-block';
        }
        loadListings();
      }

      async function loadListings() {
        var result = await sbClient.from('marketplace_listings').select('*, profiles(full_name, username, phone)').order('created_at', { ascending: false });
        var container = document.getElementById('listingsGrid');
        var now = new Date();
        var fourteenDaysAgo = new Date(now);
        fourteenDaysAgo.setDate(fourteenDaysAgo.getDate() - 14);

        allListings = (result.data || []).filter(function(l) {
          return new Date(l.created_at) >= fourteenDaysAgo;
        });

        if (!allListings.length) { container.innerHTML = '<p class="coming-soon">No listings yet — be the first to post!</p>'; return; }

        container.innerHTML = allListings.map(renderListingCard).join('');
      }

function renderListingCard(l) {
  var seller = l.profiles || {};
  var sellerName = seller.full_name || seller.username || 'Unknown';
  var images = l.image_urls || [];
  var imageHtml;
  if (images.length > 1) {
    imageHtml = '<div class="listing-image" style="background-image:url(' + images[0] + ');cursor:pointer;position:relative;" data-index="0" data-listing-id="' + l.id + '" onclick="cycleListingImage(this)">' +
      '<span style="position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.75em;">1 / ' + images.length + '</span>' +
      '</div>';
  } else if (images.length === 1) {
    imageHtml = '<div class="listing-image" style="background-image:url(' + images[0] + ');"></div>';
  } else {
    imageHtml = '<div class="listing-image">No image</div>';
  }

        var badgesHtml = '';
        if (l.price != null) { badgesHtml += '<span class="listing-badge badge-price">£' + l.price + '</span>'; }
        if (l.allow_swap) { badgesHtml += '<span class="listing-badge badge-swap">Open to Swap</span>'; }

        var waLink = buildWhatsAppLink(seller.phone);
        var enquireBtn = waLink ? '<a href="' + waLink + '" target="_blank" rel="noopener" class="whatsapp-btn">💬 Enquire</a>' : '';

        var isOwner = currentUserId === l.seller_id;
        var canManage = isOwner || isCurrentUserAdmin;
        var manageButtons = canManage ? '<button class="btn btn-secondary" style="padding:8px 14px;font-size:0.85em;" onclick="openListingForm(' + l.id + ')">Edit</button><button class="btn btn-danger" style="padding:8px 14px;font-size:0.85em;" onclick="deleteListing(' + l.id + ')">Delete</button>' : '';

        return '<div class="listing-card">' +
          imageHtml +
          '<div class="listing-body">' +
          '<div class="listing-title">' + l.title + '</div>' +
          (l.weight ? '<div class="listing-meta">Weight: ' + l.weight + '</div>' : '') +
          '<div class="listing-badges">' + badgesHtml + '</div>' +
          '<div class="listing-desc">' + (l.description || '') + '</div>' +
          '<div class="listing-seller">Posted by ' + sellerName + '</div>' +
          '<div class="listing-actions">' + enquireBtn + manageButtons + '</div>' +
          '</div></div>';
      }

     var editingImageUrls = [];

function openListingForm(id) {
  editingListingId = id || null;
  var listing = id ? allListings.find(function(l) { return l.id === id; }) : null;
  editingImageUrls = listing && listing.image_urls ? listing.image_urls.slice() : [];

  document.getElementById('listingFormContainer').innerHTML =
    '<div class="form-box">' +
    '<h3>' + (id ? 'Edit Listing' : 'Post a Listing') + '</h3>' +
    '<div class="success-msg" id="listing-success"></div>' +
    '<div class="error-msg" id="listing-error"></div>' +
    '<div class="form-group"><label>Title</label><input type="text" id="listingTitle" value="' + (listing ? listing.title.replace(/"/g, '&quot;') : '') + '" placeholder="e.g. Target Darts Steel Tips" /></div>' +
    '<div class="form-row">' +
    '<div class="form-group"><label>Weight</label><input type="text" id="listingWeight" value="' + (listing ? (listing.weight || '') : '') + '" placeholder="e.g. 23g" /></div>' +
    '<div class="form-group"><label>Price (£, optional)</label><input type="number" id="listingPrice" value="' + (listing && listing.price != null ? listing.price : '') + '" placeholder="e.g. 25" /></div>' +
    '</div>' +
    '<div class="form-group" style="display:flex;align-items:center;gap:8px;">' +
    '<input type="checkbox" id="listingSwap" style="width:18px;height:18px;"' + (listing && listing.allow_swap ? ' checked' : '') + ' />' +
    '<label style="margin:0;">Open to swap</label>' +
    '</div>' +
    '<div class="form-group"><label>Description</label><textarea id="listingDesc" rows="3" placeholder="Describe the item...">' + (listing ? (listing.description || '') : '') + '</textarea></div>' +
    '<div class="form-group"><label>Current Images</label><div id="currentImagesList"></div></div>' +
    '<div class="form-group"><label>Add New Images</label><input type="file" id="listingImages" accept="image/*" multiple /></div>' +
    '<button class="btn btn-primary" onclick="saveListing()">' + (id ? 'Save Changes' : 'Post Listing') + '</button> ' +
    '<button class="btn btn-secondary" onclick="closeListingForm()">Cancel</button>' +
    '</div>';

  renderCurrentImagesList();
  document.getElementById('listingFormContainer').scrollIntoView({ behavior: 'smooth' });
}

function renderCurrentImagesList() {
  var container = document.getElementById('currentImagesList');
  if (!container) { return; }
  if (!editingImageUrls.length) { container.innerHTML = '<p style="color:#888;font-size:0.85em;">No images yet.</p>'; return; }
  container.innerHTML = '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + editingImageUrls.map(function(url, i) {
    return '<div style="position:relative;">' +
      '<img src="' + url + '" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #ddd;" />' +
      '<button onclick="removeExistingImage(' + i + ')" style="position:absolute;top:-6px;right:-6px;background:#cc0000;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:0.8em;">✕</button>' +
      '</div>';
  }).join('') + '</div>';
}

function removeExistingImage(index) {
  editingImageUrls.splice(index, 1);
  renderCurrentImagesList();
}

      function closeListingForm() {
        document.getElementById('listingFormContainer').innerHTML = '';
        editingListingId = null;
      }

      async function saveListing() {
        var title = document.getElementById('listingTitle').value.trim();
        if (!title) { showListingMsg('listing-error', 'Please enter a title.'); return; }

        var weight = document.getElementById('listingWeight').value.trim();
        var priceVal = document.getElementById('listingPrice').value;
        var price = priceVal ? parseFloat(priceVal) : null;
        var allowSwap = document.getElementById('listingSwap').checked;
        var description = document.getElementById('listingDesc').value.trim();
        var fileInput = document.getElementById('listingImages');
        var files = Array.from(fileInput.files || []).slice(0, 4);

var imageUrls = editingImageUrls.slice();

for (var i = 0; i < files.length; i++) {
          var file = files[i];
          var fileExt = file.name.split('.').pop();
          var fileName = (currentUserId || 'anon') + '_' + Date.now() + '_' + i + '.' + fileExt;
          var uploadResult = await sbClient.storage.from('marketplace-images').upload(fileName, file);
          if (uploadResult.error) { showListingMsg('listing-error', 'Error uploading image: ' + uploadResult.error.message); return; }
          var urlData = sbClient.storage.from('marketplace-images').getPublicUrl(fileName);
          imageUrls.push(urlData.data.publicUrl);
        }

        var payload = {
          title: title,
          weight: weight || null,
          price: price,
          allow_swap: allowSwap,
          description: description || null,
          image_urls: imageUrls
        };

        var result;
        if (editingListingId) {
          result = await sbClient.from('marketplace_listings').update(payload).eq('id', editingListingId);
        } else {
          payload.seller_id = currentUserId;
          result = await sbClient.from('marketplace_listings').insert([payload]);
        }

        if (result.error) { showListingMsg('listing-error', result.error.message); return; }

        closeListingForm();
        loadListings();
      }

      async function deleteListing(id) {
        if (!confirm('Delete this listing?')) { return; }
        var result = await sbClient.from('marketplace_listings').delete().eq('id', id);
        if (result.error) { alert('Error deleting listing: ' + result.error.message); return; }
        loadListings();
      }

      function showListingMsg(id, msg) {
        var el = document.getElementById(id);
        el.textContent = msg;
        el.style.display = 'block';
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', function() {
        checkAuth();
        init();
      });
    </script>

  </body>
</html>
