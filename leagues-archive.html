<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Archive | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 500; }      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
.hamburger { display: block; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; margin-left: auto; }
nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: #000000; z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
nav.open { display: flex; }
nav a { color: #ffffff; text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #333333; }
nav a:hover { background-color: #222222; }
nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #333333; border-radius: 0; min-width: unset; padding: 14px 24px; font-size: 1em; margin: 0; }
nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #222222; color: #ffffff; }
nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #333333; }
      main { padding: 40px; max-width: 900px; margin: 0 auto; }
      .back-link { display: inline-block; margin-bottom: 20px; color: #111111; text-decoration: none; font-size: 0.9em; }
      .back-link:hover { text-decoration: underline; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; }
      .league-card { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; padding: 20px; margin-bottom: 16px; }
      .league-card h3 { margin: 0 0 8px; font-size: 1.2em; }
      .league-card p { margin: 4px 0; color: #555555; font-size: 0.95em; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
      .badge-status-completed { background-color: #fff0f0; color: #cc0000; border: 1px solid #ffcccc; }
      .card-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
      .btn-view { background-color: #111111; color: #ffffff; border: none; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; cursor: pointer; text-decoration: none; font-family: Arial, sans-serif; display: inline-block; }
      .btn-view:hover { background-color: #333333; }
      .coming-soon { text-align: center; padding: 60px 20px; color: #aaaaaa; font-size: 1.1em; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
.header-buttons { margin-left: 0; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
.btn-switch, .btn-login, .btn-logout { font-size: 0.8em; padding: 6px 12px; min-width: 140px; }
main { padding: 24px 20px; }
        h2 { font-size: 1.3em; }
      }
    </style>
  </head>
  <body>

  <header>
  <img src="logo.png" alt="Pinnacle Darts Logo">
  <div>
    <h1>Pinnacle Darts League</h1>
    <p>Official League Website</p>
  </div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <nav id="mainNav">
    <a href="index.html">Home</a>
    <a href="leagues.html">Leagues</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="players.html">Players</a>
    <a href="academy.html" class="btn-switch" style="border:none;min-width:unset;text-align:left;">Switch to Academy</a>
    <div id="authButtons" style="padding:14px 24px;"></div>
  </nav>
</header>

    <main>
      <a href="leagues.html" class="back-link">← Back to Leagues</a>
      <h2>League Archive</h2>
      <div id="archiveList"><p class="loading">Loading completed leagues...</p></div>
    </main>

    <script>
      async function loadArchive() {
        var result = await sbClient.from('leagues').select('*').order('end_date', { ascending: false });
        var container = document.getElementById('archiveList');

        if (!result.data || !result.data.length) {
          container.innerHTML = '<p class="coming-soon">No completed leagues yet.</p>';
          return;
        }

        var formatLabels = { round_robin: 'Round Robin', home_away: 'Home & Away', swiss: 'Swiss System' };
        var platformLabels = { dartcounter: 'Dartcounter', scolia: 'Scolia', in_person: 'In Person', both: 'Both' };

        var cardsHtml = [];
        for (var i = 0; i < result.data.length; i++) {
          var l = result.data[i];
          var status = await computeLeagueStatus(l);
          if (status !== 'completed') { continue; }

          var endStr = l.end_date ? new Date(l.end_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
          cardsHtml.push('<div class="league-card">' +
            '<span class="badge badge-status-completed">Completed</span>' +
            '<h3>' + l.name + '</h3>' +
            (l.season ? '<p><strong>Season:</strong> ' + l.season + '</p>' : '') +
            '<p><strong>Format:</strong> ' + (formatLabels[l.format] || l.format || 'TBC') + (l.playoffs ? ' + Playoffs' : '') + '</p>' +
            '<p><strong>Platform:</strong> ' + (platformLabels[l.platform] || l.platform || 'TBC') + '</p>' +
            '<p><strong>Ended:</strong> ' + endStr + '</p>' +
            '<div class="card-actions">' +
            '<a href="league.html?id=' + l.id + '" class="btn-view">View Results</a>' +
            '</div>' +
            '</div>');
        }

        container.innerHTML = cardsHtml.length ? cardsHtml.join('') : '<p class="coming-soon">No completed leagues yet.</p>';
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', function() {
        checkAuth();
        loadArchive();
      });
    </script>

  </body>
</html>
