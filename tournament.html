<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      .badge-status-upcoming { background-color: #eeeeee; color: #666666; }
.badge-status-live { background-color: #f0fff0; color: #006600; border: 1px solid #cceecc; }
.badge-status-completed { background-color: #fff0f0; color: #cc0000; border: 1px solid #ffcccc; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
      .hamburger { display: none; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; }
      nav { background-color: #222222; display: flex; justify-content: center; gap: 40px; padding: 15px; }
      nav a { color: #ffffff; text-decoration: none; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; }
      nav a:hover { color: #aaaaaa; }
      main { padding: 40px; max-width: 900px; margin: 0 auto; }
      .back-link { display: inline-block; margin-bottom: 20px; color: #111111; text-decoration: none; font-size: 0.9em; }
      .back-link:hover { text-decoration: underline; }
      h2 { border-bottom: 3px solid #111111; padding-bottom: 8px; margin-bottom: 24px; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
      .badge-upcoming { background-color: #111111; color: #ffffff; }
      .badge-active { background-color: #f0fff0; color: #006600; border: 1px solid #cceecc; }
      .badge-completed { background-color: #dddddd; color: #111111; }
      .tabs { display: flex; gap: 4px; margin-bottom: 30px; border-bottom: 2px solid #dddddd; flex-wrap: wrap; }
      .tab { padding: 10px 20px; cursor: pointer; font-size: 0.95em; border: none; background: none; color: #555555; font-family: Arial, sans-serif; border-bottom: 3px solid transparent; margin-bottom: -2px; }
      .tab.active { color: #000000; font-weight: bold; border-bottom: 3px solid #000000; }
      .tab:hover { color: #000000; }
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
      .info-box { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; padding: 16px; }
      .info-box .label { font-size: 0.8em; color: #888888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
      .info-box .value { font-size: 1.1em; font-weight: bold; }
      .description-box { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
      .description-box p { margin: 0; color: #444444; line-height: 1.6; }
      .player-list { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; overflow: hidden; }
      .player-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #eeeeee; }
      .player-item:last-child { border-bottom: none; }
      .player-avatar-small { width: 36px; height: 36px; border-radius: 50%; background-color: #111111; color: #ffffff; font-size: 1em; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; }
      .player-info { display: flex; align-items: center; flex: 1; }
      .player-name { font-weight: bold; font-size: 0.95em; }
      .player-username { color: #888888; font-size: 0.85em; }
      .btn-remove { background: none; border: 1px solid #cc0000; color: #cc0000; padding: 4px 10px; border-radius: 4px; font-size: 0.8em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-remove:hover { background-color: #fff0f0; }
      .group-card { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
      .group-card h3 { margin: 0 0 16px; font-size: 1.1em; padding-left: 12px; border-left: 4px solid #000000; }
      .group-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9em; }
      .group-table th { background-color: #111111; color: #ffffff; padding: 8px 10px; text-align: left; }
      .group-table td { padding: 8px 10px; border-bottom: 1px solid #eeeeee; }
      .group-table tr:last-child td { border-bottom: none; }
      .fixture-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background-color: #f9f9f9; border: 1px solid #eeeeee; border-radius: 4px; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
      .fixture-players { font-size: 0.9em; font-weight: bold; flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .fixture-vs { color: #888888; margin: 0 8px; }
      .score-inputs { display: flex; align-items: center; gap: 6px; }
      .score-input { width: 50px; padding: 4px 8px; border: 1px solid #dddddd; border-radius: 4px; font-size: 0.9em; text-align: center; }
      .btn-submit-score { background-color: #111111; color: #ffffff; border: none; padding: 4px 12px; border-radius: 4px; font-size: 0.85em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-submit-score:hover { background-color: #333333; }
      .score-display { font-weight: bold; font-size: 0.95em; }
      .winner-text { font-weight: bold; color: #006600; }
      .round-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
      .round-tab { padding: 8px 16px; border: 1px solid #dddddd; background: #ffffff; border-radius: 20px; font-size: 0.85em; cursor: pointer; font-family: Arial, sans-serif; color: #555555; }
      .round-tab.active { background: #111111; color: #ffffff; border-color: #111111; font-weight: bold; }
      .bracket-toggle { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
      .bracket-toggle-btn { padding: 10px 20px; border: 2px solid #111111; background: #ffffff; border-radius: 6px; font-size: 0.9em; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; color: #111111; }
      .bracket-toggle-btn.active { background: #111111; color: #ffffff; }
      .coming-soon { text-align: center; padding: 40px; color: #aaaaaa; font-size: 1em; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        .header-buttons { margin-left: 0; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
        .btn-switch, .btn-login, .btn-logout { font-size: 0.8em; padding: 6px 12px; min-width: 140px; }
        .hamburger { display: block; }
        nav { display: none; flex-direction: column; gap: 0; padding: 0; }
        nav.open { display: flex; }
        nav a { padding: 14px 20px; border-bottom: 1px solid #333333; font-size: 1em; }
        main { padding: 24px 20px; }
        .info-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
      <a href="academy.html" class="btn-switch">Switch to Academy</a>
      <div class="header-buttons" style="margin-left: auto;">
        <div id="authButtons"></div>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
      </div>
    </header>

    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a href="leagues.html">Leagues</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="players.html">Players</a>
    </nav>

    <main>
      <a href="tournaments.html" class="back-link">← Back to Tournaments</a>
      <div id="tournamentContent"><p class="loading">Loading...</p></div>
    </main>

    <script>
      var tournamentId = null;
      var isAdmin = false;
      var currentUserId = null;
      var tournamentFormat = '';
      var tournamentData = null;
      var profileMap = {};
      var roundOrderFull = ['Round of 64', 'Round of 32', 'Round of 16', 'Quarter Final', 'Semi Final', 'Final'];
      var cachedBracketsByType = {};

      function buildWhatsAppLink(phone) {
        if (!phone) { return null; }
        var digits = phone.replace(/[^\d]/g, '');
        if (!digits) { return null; }
        return 'https://wa.me/' + digits;
      }

      function whatsAppButtonHtml(opponentId) {
        var opponent = profileMap[opponentId];
        if (!opponent) { return ''; }
        var link = buildWhatsAppLink(opponent.phone);
        if (!link) { return ''; }
        return '<a href="' + link + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;background-color:#25D366;color:#ffffff;padding:4px 10px;border-radius:20px;font-size:0.8em;text-decoration:none;font-weight:bold;">💬 WhatsApp</a>';
      }

      async function loadTournament() {
        var params = new URLSearchParams(window.location.search);
        tournamentId = params.get('id');
        if (!tournamentId) { window.location.href = 'tournaments.html'; return; }

        var session = await sbClient.auth.getSession();
        if (session.data.session) {
          currentUserId = session.data.session.user.id;
          var profile = await sbClient.from('profiles').select('is_admin').eq('id', currentUserId).single();
          if (profile.data) { isAdmin = profile.data.is_admin; }
        }

        var profilesResult = await sbClient.from('profiles').select('id, full_name, username, phone');
        if (profilesResult.data) {
          profilesResult.data.forEach(function(p) {
            profileMap[p.id] = { name: p.full_name || p.username || 'Unknown', phone: p.phone || null };
          });
        }

        var result = await sbClient.from('tournaments').select('*').eq('id', tournamentId).single();
        if (result.error || !result.data) { window.location.href = 'tournaments.html'; return; }

        tournamentData = result.data;
        tournamentFormat = tournamentData.format;

        var formatLabels = {
          single_elimination: 'Single Elimination',
          single_elimination_b: 'Single Elimination + B Bracket',
          group_knockout: 'Group Stages + Knockout'
        };
        var platformLabels = {
          dartcounter: 'Dartcounter', scolia: 'Scolia', in_person: 'In Person', both: 'Both'
        };

var dateStr = tournamentData.date ? new Date(tournamentData.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
        var timeStr = tournamentData.time || 'TBC';
        var currentStatus = await computeTournamentStatus(tournamentData);
        var isGroupKnockout = tournamentFormat === 'group_knockout';
        var isSingleElim = tournamentFormat === 'single_elimination' || tournamentFormat === 'single_elimination_b';

        var groupsTab = isGroupKnockout ? '<button class="tab" onclick="showTab(\'groups\', event)">Groups</button>' : '';
        var groupsContent = isGroupKnockout ? '<div id="tab-groups" class="tab-content"><div id="groupsContent"><p class="loading">Loading groups...</p></div></div>' : '';

        document.getElementById('tournamentContent').innerHTML =
        getStatusBadgeHtml(currentStatus) +
          '<h2>' + tournamentData.name + '</h2>' +
          '<div class="tabs">' +
          '<button class="tab active" onclick="showTab(\'info\', event)">Info</button>' +
          '<button class="tab" onclick="showTab(\'players\', event)">Participating Players</button>' +
          groupsTab +
          '<button class="tab" onclick="showTab(\'knockouts\', event)">' + (isSingleElim ? 'Bracket' : 'Knockouts') + '</button>' +
          '</div>' +
          '<div id="tab-info" class="tab-content active">' +
          '<div class="info-grid">' +
          '<div class="info-box"><div class="label">Date</div><div class="value">' + dateStr + '</div></div>' +
          '<div class="info-box"><div class="label">Time</div><div class="value">' + timeStr + '</div></div>' +
          '<div class="info-box"><div class="label">Format</div><div class="value">' + (formatLabels[tournamentData.format] || tournamentData.format || 'TBC') + '</div></div>' +
          '<div class="info-box"><div class="label">Platform</div><div class="value">' + (platformLabels[tournamentData.platform] || tournamentData.platform || 'TBC') + '</div></div>' +
          (tournamentData.max_players ? '<div class="info-box"><div class="label">Max Players</div><div class="value">' + tournamentData.max_players + '</div></div>' : '') +
          '</div>' +
          (tournamentData.description ? '<div class="description-box"><p>' + tournamentData.description + '</p></div>' : '') +
          '</div>' +
          '<div id="tab-players" class="tab-content"><div id="playersList"><p class="loading">Loading players...</p></div></div>' +
          groupsContent +
          '<div id="tab-knockouts" class="tab-content"><div id="knockoutsContent"><p class="loading">Loading bracket...</p></div></div>';

        loadPlayers();
        if (isGroupKnockout) { loadGroups(); }
        loadKnockouts();
      }

      async function loadPlayers() {
        var result = await sbClient.from('tournament_players').select('player_id, profiles(full_name, username)').eq('tournament_id', tournamentId);
        var container = document.getElementById('playersList');
        if (!result.data || !result.data.length) { container.innerHTML = '<p class="coming-soon">No players have joined yet.</p>'; return; }
        container.innerHTML = '<div class="player-list">' +
          result.data.map(function(p) {
            var profile = p.profiles || {};
            var name = profile.full_name || profile.username || 'Unknown';
            var username = profile.username ? '@' + profile.username : '';
            var initial = name[0].toUpperCase();
            var removeBtn = isAdmin ? '<button class="btn-remove" onclick="removePlayer(\'' + p.player_id + '\')">Remove</button>' : '';
            return '<div class="player-item"><div class="player-info"><div class="player-avatar-small">' + initial + '</div><div><div class="player-name">' + name + '</div><div class="player-username">' + username + '</div></div></div>' + removeBtn + '</div>';
          }).join('') + '</div>';
      }

      async function removePlayer(playerId) {
        if (!confirm('Remove this player from the tournament?')) { return; }
        await sbClient.from('tournament_players').delete().eq('tournament_id', tournamentId).eq('player_id', playerId);
        loadPlayers();
      }

     async function loadGroups() {
  var groupsResult = await sbClient.from('tournament_groups').select('*, tournament_group_players(player_id, profiles(full_name, username))').eq('tournament_id', tournamentId).order('group_name');
  var container = document.getElementById('groupsContent');
  if (!groupsResult.data || !groupsResult.data.length) { container.innerHTML = '<p class="coming-soon">Groups have not been drawn yet.</p>'; return; }

  var matchesResult = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'group');
  var matches = matchesResult.data || [];

  container.innerHTML = groupsResult.data.map(function(group) {
    var groupPlayers = group.tournament_group_players || [];
    var playerMap = {};
    groupPlayers.forEach(function(gp) { var profile = gp.profiles || {}; playerMap[gp.player_id] = profile.full_name || profile.username || 'Unknown'; });

    var standings = groupPlayers.map(function(gp) {
      var played = 0, won = 0, lost = 0, pts = 0;
      matches.forEach(function(m) {
        if (m.group_id !== group.id || m.status !== 'completed') { return; }
        if (m.player1_id === gp.player_id) { played++; if (m.player1_score > m.player2_score) { won++; pts += 3; } else { lost++; } }
        else if (m.player2_id === gp.player_id) { played++; if (m.player2_score > m.player1_score) { won++; pts += 3; } else { lost++; } }
      });
      return { name: playerMap[gp.player_id], played: played, won: won, lost: lost, pts: pts };
    }).sort(function(a, b) { return b.pts - a.pts; });

    var groupFixtures = matches.filter(function(m) { return m.group_id === group.id; });
    var fixturesHtml = groupFixtures.map(function(m) {
      var p1name = playerMap[m.player1_id] || 'Unknown';
      var p2name = playerMap[m.player2_id] || 'Unknown';

      var whatsAppHtml = '';
      if (currentUserId === m.player1_id) { whatsAppHtml = whatsAppButtonHtml(m.player2_id); }
      else if (currentUserId === m.player2_id) { whatsAppHtml = whatsAppButtonHtml(m.player1_id); }

      var playersHtml = '<div class="fixture-players">' + p1name + ' <span class="fixture-vs">vs</span> ' + p2name + whatsAppHtml + '</div>';

      var isP1 = currentUserId === m.player1_id;
      var isP2 = currentUserId === m.player2_id;

      if (m.status === 'completed') {
        var scoreBlock = '<div class="score-display">' + m.player1_score + ' - ' + m.player2_score + '</div>';
        var myAvgMissing = (isP1 && m.player1_avg == null) || (isP2 && m.player2_avg == null);
        if (myAvgMissing) {
          var myAvgFieldId = isP1 ? 'gmyavg1_' + m.id : 'gmyavg2_' + m.id;
          scoreBlock += '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;">' +
            '<input class="score-input" type="number" step="0.01" id="' + myAvgFieldId + '" placeholder="Your Avg" style="width:80px;" />' +
            '<button class="btn-submit-score" onclick="submitGroupAverageOnly(' + m.id + ', ' + isP1 + ')">Add My Avg</button>' +
            '</div>';
        }
        return '<div class="fixture-item">' + playersHtml + scoreBlock + '</div>';
      }
      var canSubmit = currentUserId && (isP1 || isP2);
      if (canSubmit) {
        var myAvgId = isP1 ? 'gavg1_' + m.id : 'gavg2_' + m.id;
        return '<div class="fixture-item">' + playersHtml +
          '<div class="score-inputs"><input class="score-input" type="number" id="s1_' + m.id + '" min="0" placeholder="0" /><span>-</span><input class="score-input" type="number" id="s2_' + m.id + '" min="0" placeholder="0" />' +
          '<input class="score-input" type="number" step="0.01" id="' + myAvgId + '" placeholder="Your Avg" style="width:80px;" />' +
          '<button class="btn-submit-score" onclick="submitGroupScore(' + m.id + ', ' + isP1 + ')">Submit</button></div></div>';
      }
      return '<div class="fixture-item">' + playersHtml + '<div class="score-display" style="color:#aaa">Pending</div></div>';
    }).join('');

    return '<div class="group-card"><h3>' + group.group_name + '</h3>' +
      '<table class="group-table"><thead><tr><th>Player</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>' +
      standings.map(function(s) { return '<tr><td>' + s.name + '</td><td>' + s.played + '</td><td>' + s.won + '</td><td>' + s.lost + '</td><td><strong>' + s.pts + '</strong></td></tr>'; }).join('') +
      '</tbody></table><h4 style="margin:16px 0 8px;font-size:0.95em;">Fixtures</h4>' + fixturesHtml + '</div>';
  }).join('');
}

async function submitGroupScore(matchId, isP1) {
  var s1 = parseInt(document.getElementById('s1_' + matchId).value);
  var s2 = parseInt(document.getElementById('s2_' + matchId).value);
  if (isNaN(s1) || isNaN(s2)) { alert('Please enter scores for both players.'); return; }

  var myAvgId = isP1 ? 'gavg1_' + matchId : 'gavg2_' + matchId;
  var myAvgVal = document.getElementById(myAvgId).value.trim();
  if (!myAvgVal) { alert('Please enter your average for this match.'); return; }

  var update = { player1_score: s1, player2_score: s2, status: 'completed' };
  if (isP1) { update.player1_avg = parseFloat(myAvgVal); } else { update.player2_avg = parseFloat(myAvgVal); }

  var result = await sbClient.from('tournament_matches').update(update).eq('id', matchId);
  if (result.error) { alert('Error submitting score. Please try again.'); return; }

  await updatePlayerAverage(currentUserId);
  loadGroups();
}

async function submitGroupAverageOnly(matchId, isP1) {
  var fieldId = isP1 ? 'gmyavg1_' + matchId : 'gmyavg2_' + matchId;
  var val = document.getElementById(fieldId).value.trim();
  if (!val) { alert('Please enter your average.'); return; }

  var update = isP1 ? { player1_avg: parseFloat(val) } : { player2_avg: parseFloat(val) };
  var result = await sbClient.from('tournament_matches').update(update).eq('id', matchId);
  if (result.error) { alert('Error saving average. Please try again.'); return; }

  await updatePlayerAverage(currentUserId);
  loadGroups();
}

      async function loadKnockouts() {
        var result = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'knockout').order('match_order');
        var container = document.getElementById('knockoutsContent');
        var all = result.data || [];
        if (!all.length) { container.innerHTML = '<p class="coming-soon">Bracket will appear here once generated.</p>'; return; }

        cachedBracketsByType = {};
        all.forEach(function(m) {
          var bt = m.bracket_type || 'A';
          if (!cachedBracketsByType[bt]) { cachedBracketsByType[bt] = []; }
          cachedBracketsByType[bt].push(m);
        });

        var order, labels;
        if (tournamentData.average_split) {
          order = ['CUPA', 'CUPA_PLATE', 'CUPB', 'CUPB_PLATE'];
          labels = {
            CUPA: tournamentData.name + ' A',
            CUPA_PLATE: tournamentData.name + ' A - Plate',
            CUPB: tournamentData.name + ' B',
            CUPB_PLATE: tournamentData.name + ' B - Plate'
          };
        } else {
          order = ['A', 'B'];
          labels = { A: 'Main Bracket', B: 'Plate (Consolation)' };
        }

        var presentTypes = order.filter(function(t) { return cachedBracketsByType[t] && cachedBracketsByType[t].length; });

        var toggleHtml = '';
        if (presentTypes.length > 1) {
          toggleHtml = '<div class="bracket-toggle">' + presentTypes.map(function(t, i) {
            return '<button class="bracket-toggle-btn' + (i === 0 ? ' active' : '') + '" onclick="switchBracketView(\'' + t + '\', this)">' + labels[t] + '</button>';
          }).join('') + '</div>';
        }

        container.innerHTML = toggleHtml + '<div id="bracketSectionContent"></div>';
        renderBracketSection(cachedBracketsByType[presentTypes[0]] || []);
      }

      function switchBracketView(type, btn) {
        document.querySelectorAll('.bracket-toggle-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderBracketSection(cachedBracketsByType[type] || []);
      }

      function renderBracketSection(matches) {
        var rounds = {};
        matches.forEach(function(m) { if (!rounds[m.round]) { rounds[m.round] = []; } rounds[m.round].push(m); });
        var roundsPresent = roundOrderFull.filter(function(r) { return rounds[r]; });

        var tabsHtml = '<div class="round-tabs">' + roundsPresent.map(function(r, i) {
          return '<button class="round-tab' + (i === 0 ? ' active' : '') + '" data-round="' + r + '" onclick="showKnockoutRound(\'' + r + '\', this)">' + r + '</button>';
        }).join('') + '</div>';

        var contentHtml = roundsPresent.map(function(r, i) {
          var rMatches = rounds[r];
          var matchesHtml = rMatches.map(function(m) {
            var p1name = m.player1_id ? (profileMap[m.player1_id] ? profileMap[m.player1_id].name : 'Unknown') : 'TBD';
            var p2name = m.player2_id ? (profileMap[m.player2_id] ? profileMap[m.player2_id].name : 'Unknown') : 'TBD';
            var p1winner = m.status === 'completed' && m.player1_score > m.player2_score;
            var p2winner = m.status === 'completed' && m.player2_score > m.player1_score;
            var canSubmit = currentUserId && m.status !== 'completed' && m.player1_id && m.player2_id &&
              (currentUserId === m.player1_id || currentUserId === m.player2_id);

            var whatsAppHtml = '';
            if (m.player1_id && m.player2_id) {
              if (currentUserId === m.player1_id) { whatsAppHtml = whatsAppButtonHtml(m.player2_id); }
              else if (currentUserId === m.player2_id) { whatsAppHtml = whatsAppButtonHtml(m.player1_id); }
            }

            var scoreHtml;
            if (m.status === 'completed') {
              scoreHtml = '<div class="score-display">' + m.player1_score + ' - ' + m.player2_score + '</div>';
            } else if (canSubmit) {
              scoreHtml = '<div class="score-inputs"><input class="score-input" type="number" id="ks1_' + m.id + '" min="0" placeholder="0" /><span>-</span><input class="score-input" type="number" id="ks2_' + m.id + '" min="0" placeholder="0" /><button class="btn-submit-score" onclick="submitKnockoutScore(' + m.id + ',\'' + r + '\',' + m.match_order + ',\'' + (m.bracket_type || 'A') + '\')">Submit</button></div>';
            } else if (m.player1_id && m.player2_id) {
              scoreHtml = '<div class="score-display" style="color:#aaa">Pending</div>';
            } else {
              scoreHtml = '<div class="score-display" style="color:#aaa">Awaiting players</div>';
            }

            return '<div class="fixture-item"><div class="fixture-players"><span class="' + (p1winner ? 'winner-text' : '') + '">' + p1name + '</span> <span class="fixture-vs">vs</span> <span class="' + (p2winner ? 'winner-text' : '') + '">' + p2name + '</span>' + whatsAppHtml + '</div>' + scoreHtml + '</div>';
          }).join('');
          return '<div class="round-content" data-round="' + r + '" style="' + (i === 0 ? '' : 'display:none;') + '">' + matchesHtml + '</div>';
        }).join('');

        document.getElementById('bracketSectionContent').innerHTML = tabsHtml + contentHtml;
      }

      function showKnockoutRound(round, btn) {
        document.querySelectorAll('.round-tab').forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelectorAll('.round-content').forEach(function(c) {
          c.style.display = c.getAttribute('data-round') === round ? '' : 'none';
        });
      }

      async function submitKnockoutScore(matchId, currentRound, matchOrder, bracketType) {
        var s1 = parseInt(document.getElementById('ks1_' + matchId).value);
        var s2 = parseInt(document.getElementById('ks2_' + matchId).value);
        if (isNaN(s1) || isNaN(s2)) { alert('Please enter scores for both players.'); return; }
        if (s1 === s2) { alert('Scores cannot be equal in a knockout match.'); return; }

        var result = await sbClient.from('tournament_matches').update({ player1_score: s1, player2_score: s2, status: 'completed' }).eq('id', matchId);
        if (result.error) { alert('Error submitting score. Please try again.'); return; }

        var matchRow = (await sbClient.from('tournament_matches').select('*').eq('id', matchId).single()).data;
        var winnerId = matchRow.player1_score > matchRow.player2_score ? matchRow.player1_id : matchRow.player2_id;

        var nextRound = getNextRoundName(currentRound);
        if (nextRound) {
          var nextOrder = Math.floor(matchOrder / 2);
          var slot = matchOrder % 2 === 0 ? 'player1_id' : 'player2_id';
          var nextMatch = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout').eq('round', nextRound).eq('match_order', nextOrder).eq('bracket_type', bracketType).single();
          if (nextMatch.data) {
            var update = {};
            update[slot] = winnerId;
            await sbClient.from('tournament_matches').update(update).eq('id', nextMatch.data.id);
          }
        }

        loadKnockouts();
      }

      function getNextRoundName(currentRound) {
        var idx = roundOrderFull.indexOf(currentRound);
        if (idx === -1 || idx === roundOrderFull.length - 1) { return null; }
        return roundOrderFull[idx + 1];
      }

      function showTab(name, event) {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
        event.target.classList.add('active');
        document.getElementById('tab-' + name).classList.add('active');
        if (name === 'players') { loadPlayers(); }
        if (name === 'groups') { loadGroups(); }
        if (name === 'knockouts') { loadKnockouts(); }
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', function() {
        checkAuth();
        loadTournament();
      });
    </script>

  </body>
</html>
