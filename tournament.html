<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      .winner-overlay { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
      .winner-overlay.open { display: flex; }
      .winner-modal { background-color: var(--pd-surface); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05); padding: 32px 28px; max-width: 420px; width: 100%; text-align: center; color: #111111; position: relative; overflow: hidden; }
      .confetti-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .confetti-piece { position: absolute; top: -20px; width: 8px; height: 14px; opacity: 0.9; animation: confettiFall linear forwards; }
      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(420px) rotate(540deg); opacity: 0; }
      }
      .winner-modal .trophy-icon { font-size: 3.5em; margin-bottom: 8px; display: inline-block; }
      .winner-modal h3 { margin: 0 0 20px; font-size: 20px; }
      .winner-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
      .winner-card { flex: 1; min-width: 140px; }
      .winner-card .winner-avatar { width: 72px; height: 72px; border-radius: 50%; background-color: #111111; color: #ffffff; font-size: 1.8em; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; overflow: hidden; background-size: cover; background-position: center; }
      .winner-card .winner-label { font-size: 11px; color: #767676; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
      .winner-card .winner-name { font-weight: bold; font-size: 1em; }
      .winner-card .winner-username { color: #767676; font-size: 0.85em; }
      .winner-close-btn { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 1.3em; color: #767676; cursor: pointer; }
      :root {
        --pd-bg-dark: #0a0a0a;
        --pd-surface: #ffffff;
        --pd-text-dark: #111111;
        --pd-text-muted: #767676;
        --pd-text-light: #ffffff;
        --pd-text-light-muted: #8a8a8a;
        --pd-border: #ececec;
        --pd-border-strong: #dcdcdc;
        --pd-radius-card: 14px;
        --pd-radius-btn: 9px;
        --pd-shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
      }
      body { margin: 0; font-family: Arial, sans-serif; background-color: var(--pd-bg-dark); color: var(--pd-text-light); }
      header { background-color: var(--pd-bg-dark); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 500; }
      header .brand { display: flex; align-items: center; gap: 10px; }
      header img { height: 34px; width: 34px; border-radius: 9px; background: #ffffff; padding: 2px; }
      header .brand-name { color: var(--pd-text-light); font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
      .hamburger { display: block; background: none; border: none; color: var(--pd-text-light); font-size: 1.6em; cursor: pointer; padding: 0; line-height: 1; }
      nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background-color: var(--pd-bg-dark); z-index: 500; flex-direction: column; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      nav.open { display: flex; }
      nav a { color: var(--pd-text-light); text-decoration: none; font-size: 1em; padding: 14px 24px; border-bottom: 1px solid #222222; }
      nav a:hover { background-color: #1a1a1a; }
      nav .btn-switch, nav .btn-login, nav .btn-logout { display: block; width: 100%; box-sizing: border-box; text-align: left; border: none; border-bottom: 1px solid #222222; border-radius: 0; padding: 14px 24px; font-size: 1em; margin: 0; color: var(--pd-text-light); background: none; cursor: pointer; font-family: Arial, sans-serif; }
      nav .btn-switch:hover, nav .btn-login:hover, nav .btn-logout:hover { background-color: #1a1a1a; }
      nav .btn-username { display: block; padding: 14px 24px; border-bottom: 1px solid #222222; color: var(--pd-text-light); font-size: 0.9em; }
      .hero { position: relative; padding: 8px 28px 30px; overflow: hidden; }
      .hero-watermark { position: fixed; bottom: -120px; right: -80px; height: 520px; width: 520px; object-fit: contain; opacity: 0.15; pointer-events: none; z-index: 0; }
      main { padding: 0 28px 40px; max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
      .back-link { position: relative; display: inline-block; margin-bottom: 16px; color: var(--pd-text-light-muted); text-decoration: none; font-size: 0.9em; }
      .back-link:hover { color: var(--pd-text-light); }
      h2 { position: relative; font-size: 24px; font-weight: bold; margin: 0 0 16px; color: var(--pd-text-light); }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
      .badge-upcoming { background-color: #eeeeee; color: #555555; }
      .badge-live { background-color: var(--pd-text-light); color: var(--pd-text-dark); }
      .badge-completed { background-color: #444444; color: #ffffff; }
      .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid #222222; flex-wrap: wrap; }
      .tab { padding: 10px 16px; cursor: pointer; font-size: 0.9em; border: none; background: none; color: var(--pd-text-light-muted); font-family: Arial, sans-serif; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tab.active { color: var(--pd-text-light); font-weight: bold; border-bottom: 2px solid var(--pd-text-light); }
      .tab:hover { color: var(--pd-text-light); }
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
      .info-box { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 16px; }
      .info-box .label { font-size: 0.75em; color: var(--pd-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
      .info-box .value { font-size: 1.05em; font-weight: bold; color: var(--pd-text-dark); }
      .description-box { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 20px; margin-bottom: 16px; }
      .description-box p { margin: 0; color: #444444; line-height: 1.6; }
      .player-list { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); overflow: hidden; }
      .player-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
      .player-item:last-child { border-bottom: none; }
      .player-avatar-small { width: 34px; height: 34px; border-radius: 50%; background-color: var(--pd-text-dark); color: var(--pd-text-light); font-size: 0.95em; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; }
      .player-info { display: flex; align-items: center; flex: 1; }
      .player-name { font-weight: bold; font-size: 0.92em; color: var(--pd-text-dark); }
      .player-username { color: var(--pd-text-muted); font-size: 0.82em; }
      .btn-remove { background: none; border: 1px solid #cc0000; color: #cc0000; padding: 4px 10px; border-radius: var(--pd-radius-btn); font-size: 0.8em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-remove:hover { background-color: #fff0f0; }
      .group-card { background-color: var(--pd-surface); border-radius: var(--pd-radius-card); box-shadow: var(--pd-shadow-card); padding: 20px; margin-bottom: 16px; }
      .group-card h3 { margin: 0 0 16px; font-size: 1.05em; color: var(--pd-text-dark); }
      .group-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.88em; }
      .group-table th { background-color: var(--pd-text-dark); color: var(--pd-text-light); padding: 8px 10px; text-align: left; }
      .group-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; color: var(--pd-text-dark); }
      .group-table tr:last-child td { border-bottom: none; }
      .fixture-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background-color: #f9f9f9; border-radius: var(--pd-radius-btn); margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
      .fixture-players { font-size: 0.9em; font-weight: bold; flex: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--pd-text-dark); }
      .fixture-vs { color: var(--pd-text-muted); margin: 0 8px; }
      .score-inputs { display: flex; align-items: center; gap: 6px; }
      .score-input { width: 50px; padding: 4px 8px; border: 1px solid var(--pd-border-strong); border-radius: 4px; font-size: 0.9em; text-align: center; }
      .btn-submit-score { background-color: var(--pd-text-dark); color: var(--pd-text-light); border: none; padding: 4px 12px; border-radius: var(--pd-radius-btn); font-size: 0.85em; cursor: pointer; font-family: Arial, sans-serif; }
      .btn-submit-score:hover { background-color: #333333; }
      .score-display { font-weight: bold; font-size: 0.95em; color: var(--pd-text-dark); }
      .winner-text { font-weight: bold; color: #006600; }
      .round-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
      .round-tab { padding: 8px 16px; border: 1px solid #dddddd; background: #ffffff; border-radius: 20px; font-size: 0.85em; cursor: pointer; font-family: Arial, sans-serif; color: #555555; }
      .round-tab.active { background: var(--pd-text-dark); color: var(--pd-text-light); border-color: var(--pd-text-dark); font-weight: bold; }
      .bracket-toggle { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
      .bracket-toggle-btn { padding: 10px 20px; border: 2px solid var(--pd-text-light); background: none; border-radius: var(--pd-radius-btn); font-size: 0.9em; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; color: var(--pd-text-light); }
      .bracket-toggle-btn.active { background: var(--pd-text-light); color: var(--pd-text-dark); }
      .coming-soon { text-align: center; padding: 40px; color: var(--pd-text-light-muted); font-size: 1em; }
      .loading { text-align: center; padding: 40px; color: var(--pd-text-light-muted); }
      @media (max-width: 700px) {
        header { padding: 14px 20px; }
        .hero { padding: 8px 20px 24px; }
        .hero-watermark { height: 420px; width: 420px; bottom: -90px; right: -70px; }
        main { padding: 0 20px 32px; }
        .info-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
<header>
  <div class="brand">
    <img src="logo.png" alt="Pinnacle Darts Logo">
    <div class="brand-name">Pinnacle Darts League</div>
  </div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <nav id="mainNav">
    <a href="index.html">Home</a>
    <a href="leagues.html">Leagues</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="players.html">Players</a>
    <a href="academy.html" class="btn-switch" style="border:none;text-align:left;">Switch to Academy</a>
    <div id="authButtons" style="padding:14px 24px;"></div>
  </nav>
</header>
<div class="hero">
  <img src="logo-watermark.png" alt="" class="hero-watermark">
</div>
    <main>
      <a href="tournaments.html" class="back-link" id="backLink">← Back to Tournaments</a>
      <div id="tournamentContent"><p class="loading">Loading...</p></div>
    </main>
    <script>
      var tournamentId = null;
      var isAdmin = false;
      var currentUserId = null;
      var tournamentFormat = '';
      var tournamentData = null;
      var profileMap = {};
      var roundOrderFull = ['Round of 64', 'Round of 32', 'Round of 16', 'Quarter Final', 'Semi Final', 'Final'];
      var cachedBracketsByType = {};
function buildWhatsAppLink(phone) {
  if (!phone) { return null; }
  var hasPlus = phone.trim().startsWith('+');
  var digits = phone.replace(/[^\d]/g, '');
  if (!digits) { return null; }
  if (!hasPlus && digits.startsWith('0')) {
    digits = '44' + digits.substring(1);
  }
  return 'https://wa.me/' + digits;
}
      function whatsAppButtonHtml(opponentId) {
        var opponent = profileMap[opponentId];
        if (!opponent) { return ''; }
        var link = buildWhatsAppLink(opponent.phone);
        if (!link) { return ''; }
        return '<a href="' + link + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;background-color:#25D366;color:#ffffff;padding:4px 10px;border-radius:20px;font-size:0.8em;text-decoration:none;font-weight:bold;">💬 WhatsApp</a>';
      }
      async function loadTournament() {
        var params = new URLSearchParams(window.location.search);
        tournamentId = params.get('id');
        if (!tournamentId) { window.location.href = 'tournaments.html'; return; }
        var session = await sbClient.auth.getSession();
        if (session.data.session) {
          currentUserId = session.data.session.user.id;
          var profile = await sbClient.from('profiles').select('is_admin').eq('id', currentUserId).single();
          if (profile.data) { isAdmin = profile.data.is_admin; }
        }
var profilesResult = await sbClient.from('profiles').select('id, full_name, username, phone, avatar_url');
if (profilesResult.data) {
  profilesResult.data.forEach(function(p) {
    profileMap[p.id] = { name: p.full_name || p.username || 'Unknown', phone: p.phone || null, username: p.username || null, avatar_url: p.avatar_url || null };
  });
}
        var result = await sbClient.from('tournaments').select('*').eq('id', tournamentId).single();
        if (result.error || !result.data) { window.location.href = 'tournaments.html'; return; }
        tournamentData = result.data;
        tournamentFormat = tournamentData.format;
        var formatLabels = {
          single_elimination: 'Single Elimination',
          single_elimination_b: 'Single Elimination + B Bracket',
          group_knockout: 'Group Stages + Knockout'
        };
        var platformLabels = {
          dartcounter: 'Dartcounter', scolia: 'Scolia', in_person: 'In Person', both: 'Both'
        };
var dateStr = tournamentData.date ? new Date(tournamentData.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'TBC';
        var timeStr = tournamentData.time || 'TBC';
        var currentStatus = await computeTournamentStatus(tournamentData);
        var isGroupKnockout = tournamentFormat === 'group_knockout';
        var isSingleElim = tournamentFormat === 'single_elimination' || tournamentFormat === 'single_elimination_b';
        var groupsTab = isGroupKnockout ? '<button class="tab" onclick="showTab(\'groups\', event)">Groups</button>' : '';
        var groupsContent = isGroupKnockout ? '<div id="tab-groups" class="tab-content"><div id="groupsContent"><p class="loading">Loading groups...</p></div></div>' : '';
        document.getElementById('tournamentContent').innerHTML =
        getStatusBadgeHtml(currentStatus) +
          '<h2>' + tournamentData.name + '</h2>' +
          '<div class="tabs">' +
          '<button class="tab active" onclick="showTab(\'info\', event)">Info</button>' +
          '<button class="tab" onclick="showTab(\'players\', event)">Participating Players</button>' +
          groupsTab +
          '<button class="tab" onclick="showTab(\'knockouts\', event)">' + (isSingleElim ? 'Bracket' : 'Knockouts') + '</button>' +
          '</div>' +
          '<div id="tab-info" class="tab-content active">' +
          '<div class="info-grid">' +
          '<div class="info-box"><div class="label">Date</div><div class="value">' + dateStr + '</div></div>' +
          '<div class="info-box"><div class="label">Time</div><div class="value">' + timeStr + '</div></div>' +
          '<div class="info-box"><div class="label">Format</div><div class="value">' + (formatLabels[tournamentData.format] || tournamentData.format || 'TBC') + '</div></div>' +
          '<div class="info-box"><div class="label">Platform</div><div class="value">' + (platformLabels[tournamentData.platform] || tournamentData.platform || 'TBC') + '</div></div>' +
          (tournamentData.max_players ? '<div class="info-box"><div class="label">Max Players</div><div class="value">' + tournamentData.max_players + '</div></div>' : '') +
          '</div>' +
          (tournamentData.description ? '<div class="description-box"><p>' + tournamentData.description + '</p></div>' : '') +
          '</div>' +
          '<div id="tab-players" class="tab-content"><div id="playersList"><p class="loading">Loading players...</p></div></div>' +
          groupsContent +
          '<div id="tab-knockouts" class="tab-content"><div id="knockoutsContent"><p class="loading">Loading bracket...</p></div></div>';
        loadPlayers();
        if (isGroupKnockout) { loadGroups(); }
        loadKnockouts();
      }
async function loadPlayers() {
  var result = await sbClient.from('tournament_players').select('id, player_id, checked_in, is_reserve, created_at, profiles(full_name, username)').eq('tournament_id', tournamentId).order('created_at', { ascending: true });
  var container = document.getElementById('playersList');
  if (!result.data || !result.data.length) { container.innerHTML = '<p class="coming-soon">No players have joined yet.</p>'; return; }
  var mainPlayers = result.data.filter(function(p) { return !p.is_reserve; });
  var reservePlayers = result.data.filter(function(p) { return p.is_reserve; });
  var now = new Date();
  var checkinOpen = tournamentData.checkin_start && tournamentData.checkin_end &&
    now >= new Date(tournamentData.checkin_start) && now <= new Date(tournamentData.checkin_end);
  var checkinBannerHtml = '';
  if (tournamentData.checkin_start && tournamentData.checkin_end) {
    var startStr = new Date(tournamentData.checkin_start).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    var endStr = new Date(tournamentData.checkin_end).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    checkinBannerHtml = '<div class="description-box" style="margin-bottom:16px;"><p><strong>Check-in window:</strong> ' + startStr + ' — ' + endStr + (checkinOpen ? ' <span style="color:#006600;font-weight:bold;">(Open now)</span>' : '') + '</p></div>';
  }
  function renderPlayerRow(p) {
    var profile = p.profiles || {};
    var name = profile.full_name || profile.username || 'Unknown';
    var username = profile.username ? '@' + profile.username : '';
    var initial = name[0].toUpperCase();
    var removeBtn = isAdmin ? '<button class="btn-remove" onclick="removePlayer(\'' + p.player_id + '\')">Remove</button>' : '';
    var checkinHtml = '';
    if (p.checked_in) {
      checkinHtml = '<span style="color:#006600;font-weight:bold;font-size:0.85em;">✓ Checked In</span>';
    } else if (currentUserId === p.player_id && checkinOpen) {
      checkinHtml = '<button class="btn-remove" style="border-color:#006600;color:#006600;" onclick="doCheckIn(' + p.id + ')">Check In</button>';
    } else if (currentUserId === p.player_id) {
      checkinHtml = '<span style="color:#aaa;font-size:0.85em;">Not checked in</span>';
    }
    return '<div class="player-item"><div class="player-info"><div class="player-avatar-small">' + initial + '</div><div><div class="player-name">' + name + '</div><div class="player-username">' + username + '</div></div></div><div style="display:flex;align-items:center;gap:8px;">' + checkinHtml + removeBtn + '</div></div>';
  }
  var mainHtml = '<div class="player-list">' + mainPlayers.map(renderPlayerRow).join('') + '</div>';
  var reserveHtml = reservePlayers.length ? '<h4 style="margin:20px 0 8px;color:var(--pd-text-light);">Reserves (in order)</h4><div class="player-list">' + reservePlayers.map(renderPlayerRow).join('') + '</div>' : '';
  container.innerHTML = checkinBannerHtml + mainHtml + reserveHtml;
}
async function doCheckIn(rowId) {
  var result = await sbClient.from('tournament_players').update({ checked_in: true }).eq('id', rowId);
  if (result.error) { alert('Error checking in: ' + result.error.message); return; }
  loadPlayers();
}
      async function removePlayer(playerId) {
        if (!confirm('Remove this player from the tournament?')) { return; }
        await sbClient.from('tournament_players').delete().eq('tournament_id', tournamentId).eq('player_id', playerId);
        loadPlayers();
      }
     async function loadGroups() {
  var groupsResult = await sbClient.from('tournament_groups').select('*, tournament_group_players(player_id, profiles(full_name, username))').eq('tournament_id', tournamentId).order('group_name');
  var container = document.getElementById('groupsContent');
  if (!groupsResult.data || !groupsResult.data.length) { container.innerHTML = '<p class="coming-soon">Groups have not been drawn yet.</p>'; return; }
  var matchesResult = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'group');
  var matches = matchesResult.data || [];
  container.innerHTML = groupsResult.data.map(function(group) {
    var groupPlayers = group.tournament_group_players || [];
    var playerMap = {};
    groupPlayers.forEach(function(gp) { var profile = gp.profiles || {}; playerMap[gp.player_id] = profile.full_name || profile.username || 'Unknown'; });
    var standings = groupPlayers.map(function(gp) {
      var played = 0, won = 0, lost = 0, pts = 0;
      matches.forEach(function(m) {
        if (m.group_id !== group.id || m.status !== 'completed') { return; }
        if (m.player1_id === gp.player_id) { played++; if (m.player1_score > m.player2_score) { won++; pts += 3; } else { lost++; } }
        else if (m.player2_id === gp.player_id) { played++; if (m.player2_score > m.player1_score) { won++; pts += 3; } else { lost++; } }
      });
      return { name: playerMap[gp.player_id], played: played, won: won, lost: lost, pts: pts };
    }).sort(function(a, b) { return b.pts - a.pts; });
    var groupFixtures = matches.filter(function(m) { return m.group_id === group.id; });
    var fixturesHtml = groupFixtures.map(function(m) {
      var p1name = playerMap[m.player1_id] || 'Unknown';
      var p2name = playerMap[m.player2_id] || 'Unknown';
      var whatsAppHtml = '';
      if (currentUserId === m.player1_id) { whatsAppHtml = whatsAppButtonHtml(m.player2_id); }
      else if (currentUserId === m.player2_id) { whatsAppHtml = whatsAppButtonHtml(m.player1_id); }
      var playersHtml = '<div class="fixture-players">' + p1name + ' <span class="fixture-vs">vs</span> ' + p2name + whatsAppHtml + '</div>';
      var isP1 = currentUserId === m.player1_id;
      var isP2 = currentUserId === m.player2_id;
      if (m.status === 'completed') {
        var scoreBlock = '<div class="score-display">' + m.player1_score + ' - ' + m.player2_score + '</div>';

            '<input class="score-input" type="number" step="0.01" id="' + myAvgFieldId + '" placeholder="Your Avg" style="width:80px;" />' +
            '<button class="btn-submit-score" onclick="submitGroupAverageOnly(' + m.id + ', ' + isP1 + ')">Add My Avg</button>' +
            '</div>';

        var myAvgId = isP1 ? 'gavg1_' + m.id : 'gavg2_' + m.id;
        return '<div class="fixture-item">' + playersHtml +
          '<div class="score-inputs"><input class="score-input" type="number" id="s1_' + m.id + '" min="0" placeholder="0" /><span>-</span><input class="score-input" type="number" id="s2_' + m.id + '" min="0" placeholder="0" />' +
          '<input class="score-input" type="number" step="0.01" id="' + myAvgId + '" placeholder="Your Avg" style="width:80px;" />' +
          '<button class="btn-submit-score" onclick="submitGroupScore(' + m.id + ', ' + isP1 + ')">Submit</button></div></div>';
      }
      return '<div class="fixture-item">' + playersHtml + '<div class="score-display" style="color:#aaa">Pending</div></div>';
    }).join('');
    return '<div class="group-card"><h3>' + group.group_name + '</h3>' +
      '<table class="group-table"><thead><tr><th>Player</th><th>P</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>' +
      standings.map(function(s) { return '<tr><td>' + s.name + '</td><td>' + s.played + '</td><td>' + s.won + '</td><td>' + s.lost + '</td><td><strong>' + s.pts + '</strong></td></tr>'; }).join('') +
      '</tbody></table><h4 style="margin:16px 0 8px;font-size:0.95em;color:var(--pd-text-dark);">Fixtures</h4>' + fixturesHtml + '</div>';
  }).join('');
}

      async function loadKnockouts() {
        var result = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'knockout').order('match_order');
        var container = document.getElementById('knockoutsContent');
        var all = result.data || [];
        if (!all.length) { container.innerHTML = '<p class="coming-soon">Bracket will appear here once generated.</p>'; return; }
        cachedBracketsByType = {};
        all.forEach(function(m) {
          var bt = m.bracket_type || 'A';
          if (!cachedBracketsByType[bt]) { cachedBracketsByType[bt] = []; }
          cachedBracketsByType[bt].push(m);
        });
        var order, labels;
        if (tournamentData.average_split) {
          order = ['CUPA', 'CUPA_PLATE', 'CUPB', 'CUPB_PLATE'];
          labels = {
            CUPA: tournamentData.name + ' A',
            CUPA_PLATE: tournamentData.name + ' A - Plate',
            CUPB: tournamentData.name + ' B',
            CUPB_PLATE: tournamentData.name + ' B - Plate'
          };
        } else {
          order = ['A', 'B'];
          labels = { A: 'Main Bracket', B: 'Plate (Consolation)' };
        }
        var presentTypes = order.filter(function(t) { return cachedBracketsByType[t] && cachedBracketsByType[t].length; });
        var toggleHtml = '';

          }).join('') + '</div>';

container.innerHTML = toggleHtml + '<div id="bracketSectionContent"></div>';
        renderBracketSection(cachedBracketsByType[presentTypes[0]] || []);

      function buildWinnerCardHtml(playerId, label) {

        var avatarInner = p && p.avatar_url ? '' : (name[0] || '?').toUpperCase();
        var avatarStyle = p && p.avatar_url ? ' style="background-image:url(' + p.avatar_url + ');"' : '';
        return '<div class="winner-card">' +

      function checkAndShowWinnerPopup() {
        var cardsHtml = '';
        if (tournamentData.average_split) {
          var finalA = (cachedBracketsByType['CUPA'] || []).find(function(m) { return m.round === 'Final'; });
          var finalB = (cachedBracketsByType['CUPB'] || []).find(function(m) { return m.round === 'Final'; });
          if (finalA && finalA.status === 'completed') {
            var winnerA = finalA.player1_score > finalA.player2_score ? finalA.player1_id : finalA.player2_id;
            cardsHtml += buildWinnerCardHtml(winnerA, tournamentData.name + ' A');
          }
          if (finalB && finalB.status === 'completed') {
            var winnerB = finalB.player1_score > finalB.player2_score ? finalB.player1_id : finalB.player2_id;
            cardsHtml += buildWinnerCardHtml(winnerB, tournamentData.name + ' B');
          }
} else {
          var finalMain = (cachedBracketsByType['A'] || []).find(function(m) { return m.round === 'Final'; });
          if (finalMain && finalMain.status === 'completed') {
            var winnerMain = finalMain.player1_score > finalMain.player2_score ? finalMain.player1_id : finalMain.player2_id;
            cardsHtml += buildWinnerCardHtml(winnerMain, null);
          }
          var finalPlate = (cachedBracketsByType['B'] || []).find(function(m) { return m.round === 'Final'; });
          if (finalPlate && finalPlate.status === 'completed') {
            var winnerPlate = finalPlate.player1_score > finalPlate.player2_score ? finalPlate.player1_id : finalPlate.player2_id;
            cardsHtml += buildWinnerCardHtml(winnerPlate, 'Plate');

      function spawnConfetti() {
        var container = document.getElementById('confettiContainer');
        container.innerHTML = '';
        var colors = ['#f5c518', '#ff6b6b', '#4dd88a', '#5b9bff', '#c084fc', '#ffffff'];

          var piece = document.createElement('div');

          piece.style.left = Math.random() * 100 + '%';

      function renderBracketSection(matches) {
  var rounds = {};

  var roundsPresent = roundOrderFull.filter(function(r) { return rounds[r]; });
  var tabsHtml = '<div class="round-tabs">' + roundsPresent.map(function(r, i) {

  }).join('') + '</div>';

      var p2name = m.player2_id ? (profileMap[m.player2_id] ? profileMap[m.player2_id].name : 'Unknown') : 'TBD';
      var p1winner = m.status === 'completed' && m.player1_score > m.player2_score;
      var p2winner = m.status === 'completed' && m.player2_score > m.player1_score;
      var isP1 = currentUserId === m.player1_id;
      var isP2 = currentUserId === m.player2_id;
      var canSubmit = currentUserId && m.status !== 'completed' && m.player1_id && m.player2_id && (isP1 || isP2);
      var whatsAppHtml = '';
      if (m.player1_id && m.player2_id) {
        if (isP1) { whatsAppHtml = whatsAppButtonHtml(m.player2_id); }
        else if (isP2) { whatsAppHtml = whatsAppButtonHtml(m.player1_id); }
      }
      var scoreHtml;
      if (m.status === 'completed') {
        scoreHtml = '<div class="score-display">' + m.player1_score + ' - ' + m.player2_score + '</div>';
        var myAvgMissing = (isP1 && m.player1_avg == null) || (isP2 && m.player2_avg == null);
        if (myAvgMissing) {
          var myAvgFieldId = isP1 ? 'kmyavg1_' + m.id : 'kmyavg2_' + m.id;
          scoreHtml += '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;">' +
            '<input class="score-input" type="number" step="0.01" id="' + myAvgFieldId + '" placeholder="Your Avg" style="width:80px;" />' +
            '<button class="btn-submit-score" onclick="submitKnockoutAverageOnly(' + m.id + ', ' + isP1 + ')">Add My Avg</button>' +
            '</div>';
        }
      } else if (canSubmit) {

          '<input class="score-input" type="number" step="0.01" id="' + myAvgId + '" placeholder="Your Avg" style="width:80px;" />' +
          '<button class="btn-submit-score" onclick="submitKnockoutScore(' + m.id + ',\'' + r + '\',' + m.match_order + ',\'' + (m.bracket_type || 'A') + '\', ' + isP1 + ')">Submit</button></div>';
      } else if (m.player1_id && m.player2_id) {
        scoreHtml = '<div class="score-display" style="color:#aaa">Pending</div>';
      } else {

      }
      return '<div class="fixture-item"><div class="fixture-players"><span class="' + (p1winner ? 'winner-text' : '') + '">' + p1name + '</span> <span class="fixture-vs">vs</span> <span class="' + (p2winner ? 'winner-text' : '') + '">' + p2name + '</span>' + whatsAppHtml + '</div>' + scoreHtml + '</div>';
    }).join('');
    return '<div class="round-content" data-round="' + r + '" style="' + (i === 0 ? '' : 'display:none;') + '">' + matchesHtml + '</div>';
  }).join('');
  document.getElementById('bracketSectionContent').innerHTML = tabsHtml + contentHtml;

      function showKnockoutRound(round, btn) {
        document.querySelectorAll('.round-tab').forEach(function(t) { t.classList.remove('active'); });

     async function submitKnockoutScore(matchId, currentRound, matchOrder, bracketType, isP1) {
  var s1 = parseInt(document.getElementById('ks1_' + matchId).value);
  var s2 = parseInt(document.getElementById('ks2_' + matchId).value);
  if (isNaN(s1) || isNaN(s2)) { alert('Please enter scores for both players.'); return; }
  if (s1 === s2) { alert('Scores cannot be equal in a knockout match.'); return; }
  var myAvgId = isP1 ? 'kavg1_' + matchId : 'kavg2_' + matchId;
  var myAvgVal = document.getElementById(myAvgId).value.trim();
  if (!myAvgVal) { alert('Please enter your average for this match.'); return; }
  var update0 = { player1_score: s1, player2_score: s2, status: 'completed' };
  if (isP1) { update0.player1_avg = parseFloat(myAvgVal); } else { update0.player2_avg = parseFloat(myAvgVal); }
  var result = await sbClient.from('tournament_matches').update(update0).eq('id', matchId);
  if (result.error) { alert('Error submitting score. Please try again.'); return; }
  await updatePlayerAverage(currentUserId); await updatePlayerStats(currentUserId);
  var matchRow = (await sbClient.from('tournament_matches').select('*').eq('id', matchId).single()).data;
  var winnerId = matchRow.player1_score > matchRow.player2_score ? matchRow.player1_id : matchRow.player2_id;
  var nextRound = getNextRoundName(currentRound);
  if (nextRound) {
    var nextOrder = Math.floor(matchOrder / 2);
    var slot = matchOrder % 2 === 0 ? 'player1_id' : 'player2_id';
    var nextMatch = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout').eq('round', nextRound).eq('match_order', nextOrder).eq('bracket_type', bracketType).single();
    if (nextMatch.data) {
      var update = {};
      update[slot] = winnerId;
      await sbClient.from('tournament_matches').update(update).eq('id', nextMatch.data.id);
    }
  }
  loadKnockouts();
}
async function submitKnockoutAverageOnly(matchId, isP1) {

  if (!val) { alert('Please enter your average.'); return; }
  var update = isP1 ? { player1_avg: parseFloat(val) } : { player2_avg: parseFloat(val) };
  var result = await sbClient.from('tournament_matches').update(update).eq('id', matchId);
  if (result.error) { alert('Error saving average. Please try again.'); return; }
  await updatePlayerAverage(currentUserId); await updatePlayerStats(currentUserId);
  loadKnockouts();
}
      function getNextRoundName(currentRound) {
        var idx = roundOrderFull.indexOf(currentRound);
        if (idx === -1 || idx === roundOrderFull.length - 1) { return null; }
        return roundOrderFull[idx + 1];
      }
