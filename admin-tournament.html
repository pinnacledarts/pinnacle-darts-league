async function processCheckIns() {
  if (!tournamentData.checkin_start || !tournamentData.checkin_end) {
    showMsg('add-player-error', 'This tournament has no check-in window set.');
    return;
  }

  var now = new Date();
  var checkinEnd = new Date(tournamentData.checkin_end);
  if (now < checkinEnd) {
    if (!confirm('The check-in window has not closed yet. Process anyway?')) { return; }
  }

  var playersResult = await sbClient.from('tournament_players').select('*').eq('tournament_id', tournamentId).eq('is_reserve', false);
  var players = playersResult.data || [];

  var notCheckedIn = players.filter(function(p) { return !p.checked_in; });
  var checkedInCount = players.length - notCheckedIn.length;

  for (var i = 0; i < notCheckedIn.length; i++) {
    await sbClient.from('tournament_players').delete().eq('id', notCheckedIn[i].id);
  }

  var reservesResult = await sbClient.from('tournament_players').select('*').eq('tournament_id', tournamentId).eq('is_reserve', true).order('created_at', { ascending: true });
  var reserves = reservesResult.data || [];

  var promoted = 0;
  for (var i = 0; i < notCheckedIn.length && i < reserves.length; i++) {
    await sbClient.from('tournament_players').update({ is_reserve: false, checked_in: true }).eq('id', reserves[i].id);
    promoted++;
  }

  showMsg('add-player-success', 'Processed! ' + notCheckedIn.length + ' removed (did not check in), ' + promoted + ' reserve(s) promoted.');
  await loadPlayers();
  buildPlayerChecklist(document.getElementById('playerSearch').value.toLowerCase().trim());
}

var manualBracketPlayerIds = [];

async function showManualBracketForm() {
  var playersResult = await sbClient.from('tournament_players').select('player_id').eq('tournament_id', tournamentId);
  if (!playersResult.data || playersResult.data.length < 2) { showMsg('knockouts-error', 'Need at least 2 players to build a bracket.'); return; }

  manualBracketPlayerIds = playersResult.data.map(function(p) { return p.player_id; });

  var slotsHtml = manualBracketPlayerIds.map(function(pid, i) {
    return '<div class="form-group"><label>Slot ' + (i + 1) + '</label><select id="manualSlot' + i + '" onchange="refreshManualBracketOptions()" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;"></select></div>';
  }).join('');

  document.getElementById('manualBracketFormContainer').innerHTML =
    '<div class="card"><h3>Manual Bracket Setup</h3>' +
    '<p style="color:#666;font-size:0.9em;margin-top:-8px;">Choose which player goes in each Round 1 slot. Adjacent slots (1&2, 3&4, etc) will play each other.</p>' +
    slotsHtml +
    '<button class="btn btn-primary" onclick="submitManualBracket(' + manualBracketPlayerIds.length + ')">Create Bracket</button> ' +
    '<button class="btn btn-secondary" onclick="document.getElementById(\'manualBracketFormContainer\').innerHTML=\'\'">Cancel</button>' +
    '</div>';

  refreshManualBracketOptions();
}

function refreshManualBracketOptions() {
  var slotCount = manualBracketPlayerIds.length;
  var currentValues = [];
  for (var i = 0; i < slotCount; i++) {
    currentValues.push(document.getElementById('manualSlot' + i).value);
  }

  for (var i = 0; i < slotCount; i++) {
    var sel = document.getElementById('manualSlot' + i);
    var myValue = currentValues[i];
    var optionsHtml = '<option value="">-- Select player --</option>';
    manualBracketPlayerIds.forEach(function(pid) {
      var usedElsewhere = currentValues.indexOf(pid) > -1 && pid !== myValue;
      if (usedElsewhere) { return; }
      optionsHtml += '<option value="' + pid + '"' + (pid === myValue ? ' selected' : '') + '>' + (profileMapAdmin[pid] || 'Unknown') + '</option>';
    });
    sel.innerHTML = optionsHtml;
  }
}

async function submitManualBracket(slotCount) {
  var existing = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout');
  if (existing.data && existing.data.length > 0) {
    if (!confirm('Bracket already exists. Regenerate?')) { return; }
    await sbClient.from('tournament_matches').delete().eq('tournament_id', tournamentId).eq('stage', 'knockout');
  }

  var selectedIds = [];
  for (var i = 0; i < slotCount; i++) {
    var val = document.getElementById('manualSlot' + i).value;
    if (!val) { showMsg('knockouts-error', 'Please select a player for every slot.'); return; }
    selectedIds.push(val);
  }

  var uniqueCheck = new Set(selectedIds);
  if (uniqueCheck.size !== selectedIds.length) { showMsg('knockouts-error', 'Each player can only be placed once.'); return; }

  var players = selectedIds.map(function(pid) { return { player_id: pid }; });
  await createBracketRounds(players, 'A');

  showMsg('knockouts-success', 'Manual bracket created!');
  document.getElementById('manualBracketFormContainer').innerHTML = '';
  loadKnockouts();
}

        if (tournamentData.max_players) {
          var wouldBeTotal = existingPlayerIds.length + checked.length;
          if (wouldBeTotal > tournamentData.max_players) {
            var canAdd = tournamentData.max_players - existingPlayerIds.length;
            showMsg('add-player-error', 'Max players is ' + tournamentData.max_players + '. You can only add ' + (canAdd > 0 ? canAdd : 0) + ' more.');
            return;
          }
        }

      var added = 0;
        for (var i = 0; i < checked.length; i++) {
          var playerId = checked[i].value;
          var paidStatus = true;
          var amountOwed = 0;

          if (tournamentData.is_paid && tournamentData.entry_fee > 0) {
            var profileResult = await sbClient.from('profiles').select('credit_balance').eq('id', playerId).single();
            var currentBalance = profileResult.data ? parseFloat(profileResult.data.credit_balance || 0) : 0;
            amountOwed = tournamentData.entry_fee;

              await sbClient.from('profiles').update({ credit_balance: newBalance }).eq('id', playerId);
              paidStatus = true;
            } else {
              paidStatus = false;
            }
          }

          var result = await sbClient.from('tournament_players').insert([{ tournament_id: parseInt(tournamentId), player_id: playerId, paid: paidStatus, amount_owed: amountOwed }]);
          if (!result.error) { added++; }

        var playersPerGroup = parseInt(document.getElementById('playersPerGroup').value) || 4;

        if (existing.data && existing.data.length > 0) {

        }
        var playersResult = await sbClient.from('tournament_players').select('player_id').eq('tournament_id', tournamentId);
        if (!playersResult.data || !playersResult.data.length) { showMsg('groups-error', 'No players have joined yet.'); return; }

        shuffleArray(players);
        var numGroups = Math.ceil(players.length / playersPerGroup);
        var groupNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

          var groupPlayers = [];
          for (var p = g; p < players.length; p += numGroups) { groupPlayers.push(players[p]); }

            await sbClient.from('tournament_group_players').insert([{ group_id: groupId, player_id: groupPlayers[p].player_id }]);
          }
          for (var p1 = 0; p1 < groupPlayers.length; p1++) {

      function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
        }
      }

async function createBracketRounds(players, bracketType) {
  bracketType = bracketType || 'A';
  var paddedLength = 1;
  while (paddedLength < players.length) { paddedLength *= 2; }
  while (players.length < paddedLength) { players.push(null); }
  var matchCount = players.length / 2;
  var firstRoundName = getRoundName(matchCount);
  var round1Inserted = [];
  for (var i = 0; i < players.length; i += 2) {
    var insertResult = await sbClient.from('tournament_matches').insert([{
      tournament_id: parseInt(tournamentId),
      player1_id: players[i] ? players[i].player_id : null,
      player2_id: players[i + 1] ? players[i + 1].player_id : null,
      stage: 'knockout', round: firstRoundName, match_order: i / 2, status: 'pending', bracket_type: bracketType
    }]).select();
    if (insertResult.data && insertResult.data[0]) { round1Inserted.push(insertResult.data[0]); }
  }
  var count = matchCount / 2;
  while (count >= 1) {
    var rName = getRoundName(count);
    for (var j = 0; j < count; j++) {
      await sbClient.from('tournament_matches').insert([{
        tournament_id: parseInt(tournamentId),
        player1_id: null, player2_id: null,
        stage: 'knockout', round: rName, match_order: j, status: 'pending', bracket_type: bracketType
      }]);
    }
    count = count / 2;
  }

  await resolveByes(round1Inserted, firstRoundName, bracketType);
}

async function resolveByes(round1Matches, firstRoundName, bracketType) {
  var byeScore = (tournamentData && tournamentData.bye_scoreline) ? tournamentData.bye_scoreline : 3;

  for (var k = 0; k < round1Matches.length; k++) {
    var m = round1Matches[k];
    var hasP1 = !!m.player1_id;
    var hasP2 = !!m.player2_id;
    if (hasP1 === hasP2) { continue; }

    var updateData = hasP1
      ? { player1_score: byeScore, player2_score: 0, status: 'completed' }
      : { player1_score: 0, player2_score: byeScore, status: 'completed' };
    await sbClient.from('tournament_matches').update(updateData).eq('id', m.id);

    var winnerId = hasP1 ? m.player1_id : m.player2_id;
    var nextRound = getNextRoundName(firstRoundName);
    if (nextRound) {
      var nextOrder = Math.floor(m.match_order / 2);
      var slot = m.match_order % 2 === 0 ? 'player1_id' : 'player2_id';
      var nextMatch = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout').eq('round', nextRound).eq('match_order', nextOrder).eq('bracket_type', bracketType).single();
      if (nextMatch.data) {
        var upd = {};
        upd[slot] = winnerId;
        await sbClient.from('tournament_matches').update(upd).eq('id', nextMatch.data.id);
      }
    }
  }
}

      async function generateSingleElimination() {
        var existing = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout');
        if (existing.data && existing.data.length > 0) {
          if (!confirm('Bracket already exists. Regenerate?')) { return; }

        }
        var playersResult = await sbClient.from('tournament_players').select('player_id').eq('tournament_id', tournamentId);
        if (!playersResult.data || !playersResult.data.length) { showMsg('knockouts-error', 'No players have joined yet.'); return; }
        var players = playersResult.data.slice();

      async function splitByAverage() {
        var existing = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout');
        if (existing.data && existing.data.length > 0) {
          if (!confirm('Bracket already exists. Regenerate?')) { return; }
          await sbClient.from('tournament_matches').delete().eq('tournament_id', tournamentId).eq('stage', 'knockout');
        }

        var playersResult = await sbClient.from('tournament_players').select('player_id, profiles(starter_average, average)').eq('tournament_id', tournamentId);
        if (!playersResult.data || playersResult.data.length < 2) { showMsg('knockouts-error', 'Need at least 2 players to split.'); return; }

        var playersWithAvg = playersResult.data.map(function(p) {
          var profile = p.profiles || {};
          var avg = profile.average || profile.starter_average || 0;
          return { player_id: p.player_id, avg: parseFloat(avg) || 0 };
        });

        var missingAvg = playersWithAvg.filter(function(p) { return !p.avg; });
        if (missingAvg.length > 0) {
          showMsg('knockouts-error', missingAvg.length + ' player(s) have no average set yet. Please set their Starter Average in the Players tab before splitting.');
          return;
        }

        playersWithAvg.sort(function(a, b) { return b.avg - a.avg; });

        var half = Math.ceil(playersWithAvg.length / 2);
        var cupA = playersWithAvg.slice(0, half);
        var cupB = playersWithAvg.slice(half);

        shuffleArray(cupA);
        shuffleArray(cupB);

        await createBracketRounds(cupA, 'CUPA');
        await createBracketRounds(cupB, 'CUPB');

        showMsg('knockouts-success', 'Split complete! ' + tournamentData.name + ' A (' + cupA.length + ' players) and ' + tournamentData.name + ' B (' + cupB.length + ' players) generated.');
        loadKnockouts();
      }

      function getPlateBracketType(mainType) {
        if (mainType === 'A') { return 'B'; }
        if (mainType === 'CUPA') { return 'CUPA_PLATE'; }
        if (mainType === 'CUPB') { return 'CUPB_PLATE'; }
        return null;
      }

function pairAvoidingSameGroup(qualifiers) {
  var remaining = qualifiers.slice();
  for (var i = remaining.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = remaining[i]; remaining[i] = remaining[j]; remaining[j] = temp;
  }
  var pairsOrdered = [];
  while (remaining.length > 1) {
    var p1 = remaining.shift();
    var idx = remaining.findIndex(function(p) { return p.group_id !== p1.group_id; });
    if (idx === -1) { idx = 0; }
    var p2 = remaining.splice(idx, 1)[0];
    pairsOrdered.push(p1, p2);
  }
  if (remaining.length === 1) { pairsOrdered.push(remaining[0]); }
  return pairsOrdered;
}

async function generateKnockouts() {
  var progressPerGroup = parseInt(document.getElementById('progressPerGroup').value) || 2;
  var generateB = document.getElementById('generateBCheckbox').checked;
  var generateBCount = parseInt(document.getElementById('generateBCount').value) || 0;

  var existing = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout');
  if (existing.data && existing.data.length > 0) {
    if (!confirm('Knockout bracket already exists. Regenerate?')) { return; }
    await sbClient.from('tournament_matches').delete().eq('tournament_id', tournamentId).eq('stage', 'knockout');
  }
  var groupsResult = await sbClient.from('tournament_groups').select('*, tournament_group_players(player_id)').eq('tournament_id', tournamentId).order('group_name');
  if (!groupsResult.data || !groupsResult.data.length) { showMsg('knockouts-error', 'No groups found. Generate groups first.'); return; }
  var matchesResult = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'group');
  var matches = matchesResult.data || [];

  var mainQualifiers = [];
  var bQualifiers = [];

  groupsResult.data.forEach(function(group) {
    var groupPlayers = group.tournament_group_players || [];
    var standings = groupPlayers.map(function(gp) {
      var pts = 0, won = 0;
      matches.forEach(function(m) {
        if (m.group_id !== group.id || m.status !== 'completed') { return; }
        if (m.player1_id === gp.player_id && m.player1_score > m.player2_score) { pts += 3; won++; }
        else if (m.player2_id === gp.player_id && m.player2_score > m.player1_score) { pts += 3; won++; }
      });
      return { player_id: gp.player_id, pts: pts, won: won };
    }).sort(function(a, b) { return b.pts - a.pts || b.won - a.won; });

    for (var i = 0; i < Math.min(progressPerGroup, standings.length); i++) {
      mainQualifiers.push({ player_id: standings[i].player_id, group_id: group.id });
    }
    if (generateB) {
      for (var j = progressPerGroup; j < Math.min(progressPerGroup + generateBCount, standings.length); j++) {
        bQualifiers.push({ player_id: standings[j].player_id, group_id: group.id });
      }
    }
  });

  if (mainQualifiers.length < 2) { showMsg('knockouts-error', 'Not enough players to generate knockouts.'); return; }

  var mainPaired = pairAvoidingSameGroup(mainQualifiers);
  await createBracketRounds(mainPaired, 'A');

  if (generateB && bQualifiers.length >= 2) {
    var bPaired = pairAvoidingSameGroup(bQualifiers);
    await createBracketRounds(bPaired, 'B');
  }

  showMsg('knockouts-success', 'Knockout bracket generated!' + (generateB && bQualifiers.length >= 2 ? ' B bracket also generated.' : ''));
  loadKnockouts();
}

      async function clearKnockouts() {
        if (!confirm('Delete the bracket?')) { return; }
        await sbClient.from('tournament_matches').delete().eq('tournament_id', tournamentId).eq('stage', 'knockout');
        document.getElementById('knockoutsContent').innerHTML = '<p class="empty-state">No bracket yet.</p>';
      }

      async function loadKnockouts() {
        var result = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'knockout').order('match_order');
        var container = document.getElementById('knockoutsContent');
        var all = result.data || [];
        if (!all.length) { container.innerHTML = '<p class="empty-state">No bracket yet.</p>'; return; }

        cachedBracketsByType = {};
        all.forEach(function(m) {
          var bt = m.bracket_type || 'A';
          if (!cachedBracketsByType[bt]) { cachedBracketsByType[bt] = []; }
          cachedBracketsByType[bt].push(m);
        });

        var order, labels;
        if (tournamentData.average_split) {
          order = ['CUPA', 'CUPA_PLATE', 'CUPB', 'CUPB_PLATE'];
          labels = {
            CUPA: tournamentData.name + ' A',
            CUPA_PLATE: tournamentData.name + ' A - Plate',
            CUPB: tournamentData.name + ' B',
            CUPB_PLATE: tournamentData.name + ' B - Plate'
          };
        } else {
          order = ['A', 'B'];
          labels = { A: 'Main Bracket', B: 'Plate (Consolation)' };
        }

        var presentTypes = order.filter(function(t) { return cachedBracketsByType[t] && cachedBracketsByType[t].length; });

        var toggleHtml = '';
        if (presentTypes.length > 1) {
          toggleHtml = '<div class="bracket-toggle">' + presentTypes.map(function(t, i) {
            return '<button class="bracket-toggle-btn' + (i === 0 ? ' active' : '') + '" onclick="switchBracketView(\'' + t + '\', this)">' + labels[t] + '</button>';
          }).join('') + '</div>';
        }

        container.innerHTML = toggleHtml + '<div id="bracketSectionContent"></div>';
        renderBracketSection(cachedBracketsByType[presentTypes[0]] || []);
      }

      function switchBracketView(type, btn) {
        document.querySelectorAll('.bracket-toggle-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderBracketSection(cachedBracketsByType[type] || []);
      }

function renderBracketSection(matches) {
  var rounds = {};
  matches.forEach(function(m) { if (!rounds[m.round]) { rounds[m.round] = []; } rounds[m.round].push(m); });
  var roundsPresent = roundOrderFull.filter(function(r) { return rounds[r]; });

  var tabsHtml = '<div class="round-tabs">' + roundsPresent.map(function(r, i) {
    return '<button class="round-tab' + (i === 0 ? ' active' : '') + '" data-round="' + r + '" onclick="showKnockoutRound(\'' + r + '\', this)">' + r + '</button>';
  }).join('') + '</div>';

  var contentHtml = roundsPresent.map(function(r, i) {
    var rMatches = rounds[r];
    var matchesHtml = rMatches.map(function(m) {
      var p1name = m.player1_id ? (profileMapAdmin[m.player1_id] || 'Unknown') : 'TBD';
      var p2name = m.player2_id ? (profileMapAdmin[m.player2_id] || 'Unknown') : 'TBD';
      var p1winner = m.status === 'completed' && m.player1_score > m.player2_score;
      var p2winner = m.status === 'completed' && m.player2_score > m.player1_score;
      var scoreHtml;
if (m.status === 'completed') {
        var kAvgLine = '<div style="font-size:0.8em;color:#888;margin-top:4px;">Avg: ' + (m.player1_avg != null ? m.player1_avg : '-') + ' vs ' + (m.player2_avg != null ? m.player2_avg : '-') + '</div>';
        scoreHtml = '<div class="score-display" style="display:block;">' + m.player1_score + ' - ' + m.player2_score + '<button class="btn-small" onclick="editKnockoutScore(' + m.id + ',\'' + r + '\',' + m.match_order + ',\'' + (m.bracket_type || 'A') + '\')">Edit</button><button class="btn-small" onclick="editKnockoutAvg(' + m.id + ', \'' + m.player1_id + '\', \'' + m.player2_id + '\')">Edit Avgs</button>' + kAvgLine + '</div>';
      } else if (m.player1_id && m.player2_id) {
        scoreHtml = '<div class="score-inputs"><input class="score-input" type="number" id="ks1_' + m.id + '" placeholder="0" /><span>-</span><input class="score-input" type="number" id="ks2_' + m.id + '" placeholder="0" />' +
          '<input class="score-input" type="number" step="0.01" id="ka1_' + m.id + '" placeholder="Avg 1" style="width:70px;" />' +
          '<input class="score-input" type="number" step="0.01" id="ka2_' + m.id + '" placeholder="Avg 2" style="width:70px;" />' +
          '<button class="btn-submit-score" onclick="saveKnockoutScore(' + m.id + ',\'' + r + '\',' + m.match_order + ',\'' + (m.bracket_type || 'A') + '\', \'' + m.player1_id + '\', \'' + m.player2_id + '\')">Submit</button></div>';
      } else {
        scoreHtml = '<div class="score-display" style="color:#aaa">Awaiting players</div>';
      }
      return '<div class="fixture-item"><div class="fixture-players"><span class="' + (p1winner ? 'winner-text' : '') + '">' + p1name + '</span> <span class="fixture-vs">vs</span> <span class="' + (p2winner ? 'winner-text' : '') + '">' + p2name + '</span></div>' + scoreHtml + '</div>';
    }).join('');
    return '<div class="round-content" data-round="' + r + '" style="' + (i === 0 ? '' : 'display:none;') + '">' + matchesHtml + '</div>';
  }).join('');

  document.getElementById('bracketSectionContent').innerHTML = tabsHtml + contentHtml;
}

      function showKnockoutRound(round, btn) {
        document.querySelectorAll('.round-tab').forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelectorAll('.round-content').forEach(function(c) {
          c.style.display = c.getAttribute('data-round') === round ? '' : 'none';
        });
      }

      async function advanceWinner(matchId, currentRound, matchOrder, bracketType) {
        var matchRow = (await sbClient.from('tournament_matches').select('*').eq('id', matchId).single()).data;
        var winnerId = matchRow.player1_score > matchRow.player2_score ? matchRow.player1_id : matchRow.player2_id;

        var nextRound = getNextRoundName(currentRound);
        if (!nextRound) { return false; }

        var nextOrder = Math.floor(matchOrder / 2);
        var slot = matchOrder % 2 === 0 ? 'player1_id' : 'player2_id';
        var nextMatch = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout').eq('round', nextRound).eq('match_order', nextOrder).eq('bracket_type', bracketType).single();
        if (nextMatch.data) {
          var update = {};
          update[slot] = winnerId;
          await sbClient.from('tournament_matches').update(update).eq('id', nextMatch.data.id);
        }
        return true;
      }

async function saveKnockoutScore(matchId, currentRound, matchOrder, bracketType, p1Id, p2Id) {
  var s1 = parseInt(document.getElementById('ks1_' + matchId).value);
  var s2 = parseInt(document.getElementById('ks2_' + matchId).value);
  if (isNaN(s1) || isNaN(s2)) { alert('Please enter scores for both players.'); return; }
  if (s1 === s2) { alert('Scores cannot be equal in a knockout match.'); return; }

  var a1Val = document.getElementById('ka1_' + matchId).value.trim();
  var a2Val = document.getElementById('ka2_' + matchId).value.trim();

  var update = { player1_score: s1, player2_score: s2, status: 'completed' };
  if (a1Val) { update.player1_avg = parseFloat(a1Val); }
  if (a2Val) { update.player2_avg = parseFloat(a2Val); }

  var result = await sbClient.from('tournament_matches').update(update).eq('id', matchId);
  if (result.error) { alert('Error saving score: ' + result.error.message); return; }

if (a1Val && p1Id) { await updatePlayerAverage(p1Id); await updatePlayerStats(p1Id); }
if (a2Val && p2Id) { await updatePlayerAverage(p2Id); await updatePlayerStats(p2Id); }

  var advanced = await advanceWinner(matchId, currentRound, matchOrder, bracketType);
  var isPlate = bracketType.indexOf('PLATE') > -1 || bracketType === 'B';
  showMsg('knockouts-success', advanced ? 'Score saved — winner advanced!' : '🏆 ' + (isPlate ? 'Plate' : 'Bracket') + ' complete! We have a winner!');

  if (tournamentData.format === 'single_elimination_b' && getPlateBracketType(bracketType)) {
    await maybeGenerateBBracket(currentRound, bracketType);
  }

  loadKnockouts();
}

function editKnockoutAvg(matchId, p1Id, p2Id) {
  var newA1 = prompt('Enter Player 1 average (leave blank to skip):');
  var newA2 = prompt('Enter Player 2 average (leave blank to skip):');

  var update = {};
  if (newA1 && newA1.trim()) { update.player1_avg = parseFloat(newA1.trim()); }
  if (newA2 && newA2.trim()) { update.player2_avg = parseFloat(newA2.trim()); }

  if (Object.keys(update).length === 0) { return; }

  sbClient.from('tournament_matches').update(update).eq('id', matchId).then(async function(result) {
    if (result.error) { alert('Error updating averages: ' + result.error.message); return; }
    if (update.player1_avg != null && p1Id) { await updatePlayerAverage(p1Id); }
    if (update.player2_avg != null && p2Id) { await updatePlayerAverage(p2Id); }
    showMsg('knockouts-success', 'Averages updated!');
    loadKnockouts();
  });
}

      function editKnockoutScore(matchId, currentRound, matchOrder, bracketType) {
        var newS1 = prompt('Enter new score for Player 1:');
        if (newS1 === null) { return; }
        var newS2 = prompt('Enter new score for Player 2:');
        if (newS2 === null) { return; }
        var s1 = parseInt(newS1);
        var s2 = parseInt(newS2);
        if (isNaN(s1) || isNaN(s2) || s1 === s2) { alert('Please enter valid, different scores.'); return; }

        sbClient.from('tournament_matches').update({ player1_score: s1, player2_score: s2 }).eq('id', matchId).then(async function(result) {
          if (result.error) { alert('Error updating score: ' + result.error.message); return; }
          await advanceWinner(matchId, currentRound, matchOrder, bracketType);
          showMsg('knockouts-success', 'Score updated and next round adjusted!');
          loadKnockouts();
        });
      }

      async function maybeGenerateBBracket(currentRound, bracketType) {
        var plateType = getPlateBracketType(bracketType);
        if (!plateType) { return; }

        var mainMatchesResult = await sbClient.from('tournament_matches').select('*').eq('tournament_id', tournamentId).eq('stage', 'knockout').eq('bracket_type', bracketType);
        var mainMatches = mainMatchesResult.data || [];
        var roundsPresentMain = roundOrderFull.filter(function(r) { return mainMatches.some(function(m) { return m.round === r; }); });
        var firstRound = roundsPresentMain[0];
        if (currentRound !== firstRound) { return; }

        var round1Matches = mainMatches.filter(function(m) { return m.round === firstRound; }).sort(function(a, b) { return a.match_order - b.match_order; });
        var allComplete = round1Matches.every(function(m) { return m.status === 'completed'; });
        if (!allComplete) { return; }

        var plateExisting = await sbClient.from('tournament_matches').select('id').eq('tournament_id', tournamentId).eq('stage', 'knockout').eq('bracket_type', plateType);
        if (plateExisting.data && plateExisting.data.length > 0) { return; }

        var losers = round1Matches.map(function(m) {
          if (!m.player1_id || !m.player2_id) { return null; }
          var loserId = m.player1_score > m.player2_score ? m.player2_id : m.player1_id;
          return { player_id: loserId };
        });

        await createBracketRounds(losers, plateType);
        showMsg('knockouts-success', 'Round 1 complete! Plate bracket generated.');
      }

      function getRoundName(numMatches) {
        if (numMatches >= 32) { return 'Round of 64'; }
        if (numMatches >= 16) { return 'Round of 32'; }
        if (numMatches >= 8) { return 'Round of 16'; }
        if (numMatches >= 4) { return 'Quarter Final'; }
        if (numMatches >= 2) { return 'Semi Final'; }
        return 'Final';
      }

      function getNextRoundName(currentRound) {
        var idx = roundOrderFull.indexOf(currentRound);
        if (idx === -1 || idx === roundOrderFull.length - 1) { return null; }
        return roundOrderFull[idx + 1];
      }

      function showMsg(id, msg) {
        var el = document.getElementById(id);
        if (!el) { return; }
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(function() { el.style.display = 'none'; }, 4000);
      }

      function showTab(name, event) {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
        event.target.classList.add('active');
        document.getElementById('tab-' + name).classList.add('active');
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', function() {
        checkAuth();
        init();
      });
    </script>
