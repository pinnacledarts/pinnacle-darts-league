<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms & Conditions | Pinnacle Darts League</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js?t=999999"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; color: #111111; }
      header { background-color: #000000; padding: 20px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      header img { height: 70px; }
      header h1 { margin: 0; color: #ffffff; font-size: 2em; }
      header p { margin: 4px 0 0; color: #cccccc; font-size: 1em; }
      .header-buttons { margin-left: auto; display: flex; gap: 10px; align-items: center; }
      .btn-switch, .btn-login, .btn-logout { color: #ffffff; text-decoration: none; border: 1px solid #ffffff; padding: 8px 18px; border-radius: 4px; font-size: 0.9em; white-space: nowrap; text-align: center; min-width: 160px; cursor: pointer; background: none; font-family: Arial, sans-serif; }
      .btn-switch:hover, .btn-login:hover, .btn-logout:hover { background-color: #ffffff; color: #000000; }
      .btn-username { color: #ffffff; font-size: 0.9em; white-space: nowrap; }
      .hamburger { display: none; background: none; border: none; color: #ffffff; font-size: 1.8em; cursor: pointer; padding: 0 10px; }
      nav { background-color: #222222; display: flex; justify-content: center; gap: 40px; padding: 15px; }
      nav a { color: #ffffff; text-decoration: none; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; }
      nav a:hover { color: #aaaaaa; }
      main { padding: 40px; max-width: 900px; margin: 0 auto; }
      .back-link { display: inline-block; margin-bottom: 20px; color: #111111; text-decoration: none; font-size: 0.9em; }
      .back-link:hover { text-decoration: underline; }
      .title-row { display: flex; align-items: center; gap: 10px; border-bottom: 3px solid #111111; padding-bottom: 8px; margin-bottom: 24px; }
      .title-row h2 { margin: 0; border: none; padding: 0; }
      .pencil-btn { background: none; border: none; cursor: pointer; font-size: 1em; color: #aaaaaa; padding: 2px 4px; }
      .pencil-btn:hover { color: #111111; }
      .content-box { background-color: #ffffff; border: 1px solid #dddddd; border-radius: 8px; padding: 30px; }
      .content-box p, .content-text { color: #333333; line-height: 1.7; white-space: pre-wrap; margin: 0; }
      .edit-textarea { width: 100%; min-height: 400px; padding: 14px; border: 1px solid #dddddd; border-radius: 6px; font-size: 1em; font-family: Arial, sans-serif; line-height: 1.6; resize: vertical; }
      .edit-textarea:focus { outline: none; border-color: #000000; }
      .edit-actions { margin-top: 12px; display: flex; gap: 8px; }
      .save-btn { background-color: #111111; color: #ffffff; border: none; border-radius: 4px; padding: 8px 20px; font-size: 0.9em; cursor: pointer; }
      .save-btn:hover { background-color: #333333; }
      .cancel-btn { background: none; border: 1px solid #dddddd; border-radius: 4px; padding: 8px 20px; font-size: 0.9em; cursor: pointer; }
      .cancel-btn:hover { background-color: #f5f5f5; }
      .loading { text-align: center; padding: 40px; color: #888888; }
      @media (max-width: 700px) {
        header { flex-wrap: wrap; padding: 16px 20px; }
        header img { height: 50px; }
        header h1 { font-size: 1.4em; }
        header p { font-size: 0.85em; }
        .header-buttons { margin-left: 0; width: 100%; justify-content: flex-end; flex-wrap: wrap; }
        .btn-switch, .btn-login, .btn-logout { font-size: 0.8em; padding: 6px 12px; min-width: 140px; }
        .hamburger { display: block; }
        nav { display: none; flex-direction: column; gap: 0; padding: 0; }
        nav.open { display: flex; }
        nav a { padding: 14px 20px; border-bottom: 1px solid #333333; font-size: 1em; }
        main { padding: 24px 20px; }
      }
    </style>
  </head>
  <body>

    <header>
      <img src="logo.png" alt="Pinnacle Darts Logo">
      <div>
        <h1>Pinnacle Darts League</h1>
        <p>Official League Website</p>
      </div>
      <a href="academy.html" class="btn-switch">Switch to Academy</a>
      <div class="header-buttons" style="margin-left: auto;">
        <div id="authButtons"></div>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
      </div>
    </header>

    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a href="leagues.html">Leagues</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="players.html">Players</a>
    </nav>

    <main>
      <a href="index.html" class="back-link">← Back to Home</a>

      <div style="margin-bottom:20px;">
        <label style="font-weight:bold;font-size:0.9em;display:block;margin-bottom:8px;">Viewing:</label>
        <select id="termsSelect" onchange="loadTerms()" style="padding:10px 14px;border:1px solid #dddddd;border-radius:4px;font-size:1em;background-color:#f9f9f9;">
          <option value="terms_online">Online Terms & Conditions</option>
          <option value="terms_academy">Academy Terms & Conditions</option>
        </select>
      </div>

      <div class="title-row">
        <h2 id="pageTitle">Terms & Conditions</h2>
        <button class="pencil-btn" id="editBtn" onclick="startEdit()" style="display:none;">✏️</button>
      </div>
      <div class="content-box" id="contentBox"><p class="loading">Loading...</p></div>
    </main>

    <script>
      let isCurrentUserAdmin = false;
      let currentContent = '';

      async function loadTerms() {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session) {
          const { data: profile } = await sbClient.from('profiles').select('is_admin').eq('id', session.user.id).single();
          isCurrentUserAdmin = profile ? profile.is_admin : false;
        }

        const key = document.getElementById('termsSelect').value;
        const label = key === 'terms_academy' ? 'Academy Terms & Conditions' : 'Online Terms & Conditions';
        document.getElementById('pageTitle').textContent = label;
        document.title = label + ' | Pinnacle Darts League';

        const { data, error } = await sbClient.from('site_pages').select('*').eq('key', key).single();
        currentContent = data ? (data.content || '') : '';

        document.getElementById('contentBox').innerHTML = `<p class="content-text">${currentContent}</p>`;
        document.getElementById('editBtn').style.display = isCurrentUserAdmin ? 'inline' : 'none';
      }

      function startEdit() {
        document.getElementById('contentBox').innerHTML = `
          <textarea class="edit-textarea" id="editArea">${currentContent}</textarea>
          <div class="edit-actions">
            <button class="save-btn" onclick="saveTerms()">Save</button>
            <button class="cancel-btn" onclick="loadTerms()">Cancel</button>
          </div>
        `;
      }

      async function saveTerms() {
        const newContent = document.getElementById('editArea').value;
        const key = document.getElementById('termsSelect').value;
        const { error } = await sbClient.from('site_pages').update({ content: newContent, updated_at: new Date().toISOString() }).eq('key', key);
        if (error) { alert('Error saving. Please try again.'); return; }
        currentContent = newContent;
        loadTerms();
      }

      function toggleMenu() {
        document.getElementById('mainNav').classList.toggle('open');
      }

      window.addEventListener('load', () => {
        checkAuth();
        const params = new URLSearchParams(window.location.search);
        if (params.get('type') === 'academy') {
          document.getElementById('termsSelect').value = 'terms_academy';
        }
        loadTerms();
      });
    </script>

  </body>
</html>
